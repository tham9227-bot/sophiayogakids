<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" font-family="Nunito, Arial, sans-serif" role="img" aria-label="Sơ đồ hướng vuốt khi massage mặt cho bé" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0702b"/>
    </marker>
    <style>
      .ar{fill:none;stroke:#c0702b;stroke-width:3.2;stroke-linecap:round;marker-end:url(#a)}
      .dt{fill:none;stroke:#c0702b;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:1 8}
      .n circle{fill:#7a4a1e}
      .n text{fill:#fff;font-size:15px;font-weight:800;text-anchor:middle;dominant-baseline:central}
      .lb{fill:#5b3a1a;font-size:14px;font-weight:700}
    </style>
  </defs>
  <rect width="440" height="520" rx="24" fill="#fff8ec"/>
  <!-- tai -->
  <ellipse cx="88" cy="270" rx="22" ry="34" fill="#f6d7bd" stroke="#8a5a34" stroke-width="3"/>
  <ellipse cx="352" cy="270" rx="22" ry="34" fill="#f6d7bd" stroke="#8a5a34" stroke-width="3"/>
  <!-- cổ -->
  <path d="M180 430 L180 480 Q220 500 260 480 L260 430" fill="#f6d7bd" stroke="#8a5a34" stroke-width="3"/>
  <!-- mặt -->
  <ellipse cx="220" cy="265" rx="135" ry="170" fill="#fbe3cf" stroke="#8a5a34" stroke-width="3"/>
  <!-- tóc -->
  <path d="M86 225 Q80 95 220 88 Q360 95 354 225 Q330 150 260 140 Q240 165 200 150 Q150 140 120 170 Q96 190 86 225z" fill="#6b4226"/>
  <!-- lông mày, mắt nhắm, mũi, miệng, má hồng -->
  <path d="M135 222 Q165 208 195 220" stroke="#6b4226" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M245 220 Q275 208 305 222" stroke="#6b4226" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M145 252 Q165 264 188 252" stroke="#6b4226" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M252 252 Q275 264 295 252" stroke="#6b4226" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M212 300 Q220 308 228 300" stroke="#8a5a34" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M198 345 Q220 362 242 345" stroke="#c4534f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="310" r="18" fill="#f7b9a8" opacity=".55"/>
  <circle cx="300" cy="310" r="18" fill="#f7b9a8" opacity=".55"/>

  <!-- 2: vuốt trán ra hai bên -->
  <path class="ar" d="M212 192 Q170 178 128 196"/>
  <path class="ar" d="M228 192 Q270 178 312 196"/>
  <!-- 3: vuốt trán lên chân tóc -->
  <path class="ar" d="M190 178 L190 154"/>
  <path class="ar" d="M220 180 L220 152"/>
  <path class="ar" d="M250 178 L250 154"/>
  <!-- 4: hai bên sống mũi -->
  <path class="ar" d="M208 232 L204 284"/>
  <path class="ar" d="M232 232 L236 284"/>
  <!-- 5: dọc lông mày (chấm) -->
  <path class="dt" d="M140 212 Q165 198 192 208"/>
  <path class="dt" d="M248 208 Q275 198 300 212"/>
  <!-- 6: thái dương xoa tròn -->
  <path class="ar" d="M112 232 a12 12 0 1 1 6 12"/>
  <path class="ar" d="M328 232 a12 12 0 1 0 -6 12"/>
  <!-- 7: dưới mắt ra thái dương -->
  <path class="dt" d="M190 274 Q160 284 128 262"/>
  <path class="dt" d="M250 274 Q280 284 312 262"/>
  <!-- 8: má lên tai -->
  <path class="ar" d="M196 318 Q150 330 116 292"/>
  <path class="ar" d="M244 318 Q290 330 324 292"/>
  <!-- 10: cằm ra hai bên -->
  <path class="ar" d="M210 392 Q160 396 124 352"/>
  <path class="ar" d="M230 392 Q280 396 316 352"/>
  <!-- 11: tai -->
  <path class="ar" d="M70 254 Q62 276 76 296"/>
  <path class="ar" d="M370 254 Q378 276 364 296"/>

  <g class="n"><circle cx="220" cy="128" r="13"/><text x="220" y="128">3</text></g>
  <g class="n"><circle cx="112" cy="190" r="13"/><text x="112" y="190">2</text></g>
  <g class="n"><circle cx="220" cy="214" r="13"/><text x="220" y="214">5</text></g>
  <g class="n"><circle cx="220" cy="262" r="13"/><text x="220" y="262">4</text></g>
  <g class="n"><circle cx="94" cy="218" r="13"/><text x="94" y="218">6</text></g>
  <g class="n"><circle cx="330" cy="270" r="13"/><text x="330" y="270">7</text></g>
  <g class="n"><circle cx="110" cy="318" r="13"/><text x="110" y="318">8</text></g>
  <g class="n"><circle cx="220" cy="410" r="13"/><text x="220" y="410">10</text></g>
  <g class="n"><circle cx="46" cy="276" r="13"/><text x="46" y="276">11</text></g>

  <text class="lb" x="220" y="40" text-anchor="middle" font-size="19">Hướng vuốt trên khuôn mặt bé</text>
  <text class="lb" x="220" y="64" text-anchor="middle" font-weight="600" fill="#8a6a4a">Mũi tên: hướng đi của ngón tay · Chấm: miết thật khẽ</text>
  <text class="lb" x="220" y="508" text-anchor="middle" font-weight="600" fill="#8a6a4a">Số trên hình = số động tác trong bài</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
