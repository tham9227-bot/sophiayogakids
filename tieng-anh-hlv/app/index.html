<!doctype html><html lang="vi"><head><meta name="robots" content="noindex,nofollow"><link rel="icon" href="../../images/favicon.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sophia Yoga English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Giao diện sáng cố định: nền be. Layout: một cột như app điện thoại; thanh tab cố định ở đáy; màn đăng nhập tách riêng */
:root{
  --bg:#F8F1E1; --surface:#FFFBF2; --ink:#3B2A18; --muted:#7A6548; --line:#E6D7BA;
  --primary:#9A5A14; --on-primary:#FFFFFF; --sun:#E8A317; --sun-soft:#F9E3B0;
  --mint-soft:#EFDDB8; --lav-soft:#F3D9B8; --sky-soft:#E9DCC3;
  --danger:#A63A26; --ok:#4F7A2E;
  --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --script:'Dancing Script','Baloo 2','Be Vietnam Pro',cursive;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 104px;
}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:22px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--script);font-weight:700;font-size:clamp(22px,8.4vw,32px);line-height:1.15;color:#D8940C;white-space:nowrap}
.login .brand{font-size:clamp(24px,9.6vw,46px)}
.brand span{color:var(--ink)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--sun-soft);color:var(--ink)}

.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--sun);background:var(--sun);color:var(--ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small-btn{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* đăng nhập */
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:20px}
.login .hero{display:flex;flex-direction:column;gap:6px}
.login .hero h1{font-size:32px}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
input[type=text],input[type=email],input[type=password]{
  min-height:46px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);width:100%}
input[type=file]{font-size:13px;max-width:100%}
.err{color:var(--danger);font-size:13px;min-height:18px}
.ok{color:var(--ok);font-weight:600}

/* trang chủ */
.stats{display:flex;gap:10px}
.stat{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{font-family:var(--display);font-size:24px;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{text-align:left;border:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-height:112px}
.tile h3{font-size:18px}
.tile.a{background:var(--mint-soft)} .tile.b{background:var(--sun-soft)} .tile.c{background:var(--lav-soft)}
.tile p{font-size:13px;color:var(--muted)}

.cue{border-left:4px solid var(--sun);padding:4px 0 4px 12px}
.cue .en{font-weight:600}
.cue .vi{color:var(--muted)}
.ipa{font-family:'Noto Sans','Segoe UI','Gentium Plus',system-ui,sans-serif;color:var(--primary);font-size:14px;line-height:1.5}
.phon{display:flex;gap:12px;align-items:center;justify-content:space-between}
.sym{font-family:'Noto Sans','Segoe UI',system-ui,sans-serif;font-size:28px;font-weight:600;color:var(--primary);min-width:2.2em;text-align:center}
.tile.d{background:var(--sky-soft)}

/* thẻ yoga */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .meta b{font-family:var(--display);font-size:16px;line-height:1.2}
.ph{width:100%;aspect-ratio:4/3;display:grid}
.card img,.big img,.pic img{width:100%;display:block;object-fit:contain;background:var(--surface)}
.card img{aspect-ratio:3/4}
.big img{height:auto;max-height:70vh}
.pic img{aspect-ratio:1/1;max-height:42vh}
.svgpic svg{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:42vh;margin:0 auto;background:#fffaf0}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid var(--line);vertical-align:-1px}
.sec{display:flex;flex-direction:column;gap:8px}
.book{perspective:1400px;height:clamp(440px,calc(100vh - 340px),760px);touch-action:pan-y}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.flip.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(80,50,10,.10)}
.face.back{transform:rotateY(180deg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.flip:not(.is-flipped) .face.back,.flip.is-flipped .face.front{pointer-events:none}
.fimg{flex:1;min-height:0;display:flex;background:var(--surface)}
.fimg img{width:100%;height:100%;object-fit:contain;display:block}
.fimg .ph{width:100%;height:100%;aspect-ratio:auto}
.ftext{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.bpad{padding:16px;display:flex;flex-direction:column;gap:14px}
.bhead{position:sticky;top:0;background:var(--surface);padding-bottom:8px;border-bottom:1px solid var(--line)}
.turn{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.turn .count{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);text-align:center;min-width:5.5em}
@media (prefers-reduced-motion: no-preference){
  .book.go-next{animation:inNext .32s ease-out} .book.go-prev{animation:inPrev .32s ease-out}
}
@keyframes inNext{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .flip{transition:none} }
.grp-title{font-size:18px;margin-top:6px;color:var(--ink)}
.sel{min-height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);width:100%;font:inherit;color:inherit}
.enrow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.enrow .en{min-width:0}
.sayb{flex:none;min-height:34px;padding:0 12px}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--surface);padding:12px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.phgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phtile{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:56px}
.phtile .sym{min-width:44px;text-align:center;font-family:var(--display);font-weight:700;font-size:19px;color:var(--primary)}
.phtile .tt{font-size:13px;font-weight:600;line-height:1.3}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;min-height:56px}
.wbtn b{font-size:16px}
.wbtn .ipa{font-size:13px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sndrow{display:flex;flex-wrap:wrap;gap:10px}.sndbox{flex:1 1 120px;display:grid;gap:6px;justify-items:center;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface)}.sndbox .sym{font-family:var(--display);font-weight:700;font-size:26px;color:var(--primary)}
.phvid{width:100%;max-width:440px;border-radius:14px;background:#000;display:block;margin:0 auto}
.tipl{margin:0;padding-left:18px;display:grid;gap:6px}
.ph-img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff;display:block}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun)}
.deck{display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%}
.deck .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.deck .meta b,.deck.soon b{font-family:var(--display);font-size:18px;line-height:1.2}
.deck.soon{padding:14px;border-style:dashed;gap:2px;background:transparent}
.cover{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--line)}
.cover img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 18%;display:block}
.ph{place-items:center;font-family:var(--display);font-weight:700;font-size:44px;color:var(--primary)}
.ph.t0{background:var(--mint-soft)} .ph.t1{background:var(--sun-soft)} .ph.t2{background:var(--lav-soft)} .ph.t3{background:var(--sky-soft)}
.ph.txt{font-size:22px;padding:16px;text-align:center;line-height:1.2}
.big{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.big .body{padding:16px;display:flex;flex-direction:column;gap:14px}
.big .ph{font-size:72px}
.pic{border-radius:16px;overflow:hidden;border:1px solid var(--line)}

/* trò chơi */
.gamecard{display:flex;flex-direction:column;gap:8px}
.opts{display:grid;gap:10px}
.ovi{font-weight:400;color:var(--muted);font-size:.92em}
.opt{min-height:48px;text-align:left;padding:8px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.opt.right{border-color:var(--ok);background:var(--mint-soft)}
.opt.wrong{border-color:var(--danger)}
.progress{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}
.word{font-family:var(--display);font-size:34px;line-height:1.1}
.pct{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.rec{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--danger)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--danger)}
@media (prefers-reduced-motion: no-preference){ .dot{animation:pulse 1s infinite} .progress i{transition:width .3s} }
@keyframes pulse{50%{opacity:.25}}
.note{background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:13px}

/* giao tiếp */
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
details.lesson summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary b{font-family:var(--display);font-size:17px}
details.lesson .lines{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
details.grp{border-top:1px solid var(--line)}
details.grp summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:48px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary b{font-family:var(--display);font-size:16px}
details.grp .lines{padding:4px 0 12px}
.line{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.line > div{min-width:0}

/* thanh tab */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.nav button{min-height:46px;border:0;background:transparent;border-radius:12px;font-size:10.5px;font-weight:600;color:var(--muted);padding:0 1px}
.nav button[aria-current="page"]{background:var(--sun-soft);color:var(--ink)}
</style>

 body control.", "/ˈpræktɪs ˈbæləns ænd ˈbɑːdi kənˈtroʊl/", "Rèn thăng bằng và kiểm soát cơ thể."], "steps": [["Begin in downward dog with both palms down.", "/bɪˈɡɪn ɪn ˈdaʊnwərd dɔːɡ wɪð boʊθ pɑːmz daʊn/", "Bắt đầu ở chó úp mặt, hai tay trên thảm."], ["Keep your left foot firmly grounded.", "/kiːp jɔːr left fʊt ˈfɜːrmli ˈɡraʊndɪd/", "Giữ bàn chân trái vững trên thảm."], ["Lift your right leg back with level hips.", "/lɪft jɔːr raɪt leɡ bæk wɪð ˈlevl hɪps/", "Nâng chân phải ra sau, hông cân bằng."], ["Breathe freely and lower your foot slowly.", "/briːð ˈfriːli ænd ˈloʊər jɔːr fʊt ˈsloʊli/", "Thở tự nhiên, hạ chân chậm."]], "tips": [["Keep your shoulders level and avoid rolling your hips.", "/kiːp jɔːr ˈʃoʊldərz ˈlevl ænd əˈvɔɪd ˈroʊlɪŋ jɔːr hɪps/", "Giữ vai cân bằng, tránh lăn mở hông."], ["For eye or blood pressure problems, ask your doctor.", "/fɔːr aɪ ɔːr blʌd ˈpreʃər ˈprɑːbləmz æsk jɔːr ˈdɑːktər/", "Nếu có bệnh mắt hoặc vấn đề huyết áp, hỏi bác sĩ trước."], ["Repeat on the other side.", "/rɪˈpiːt ɑːn ðə ˈʌðər saɪd/", "Đổi bên tập tương tự."]], "note": "Phiên âm theo giọng Anh-Mỹ. Mẫu hoạt động theo khả năng. Nguồn và mức độ: xem hướng dẫn in kèm.", "img": "img/ad-48.jpg", "thumb": "img/ad-48-t.jpg"}, {"id": "IN-06", "n": 114, "cat": "Tư thế đảo ngược", "deck": "dao-nguoc", "lvl": ["Coordination / variation", "Phối hợp, biến thể"], "en": "One-Leg Dolphin", "vi": "Cá heo nâng chân - biến thể", "ipa": "/wʌn leɡ ˈdɑːlfɪn/", "ben": ["Build support through your arms and core.", "/bɪld səˈpɔːrt θruː jɔːr ɑːrmz ænd kɔːr/", "Rèn sức nâng đỡ của tay và vùng thân giữa."], "steps": [["Place both forearms on the mat.", "/pleɪs boʊθ ˈfɔːrɑːrmz ɑːn ðə mæt/", "Đặt hai cẳng tay trên thảm."], ["Lift your hips into dolphin pose.", "/lɪft jɔːr hɪps ˈɪntuː ˈdɑːlfɪn poʊz/", "Nâng hông lên tư thế cá heo."], ["Keep your right foot down and lift your left leg.", "/kiːp jɔːr raɪt fʊt daʊn ænd lɪft jɔːr left leɡ/", "Giữ chân phải trên thảm, nâng chân trái."], ["Keep your head free and b  a comfortable spinal turn.", "/ˈpræktɪs ə ˈkʌmftərbl ˈspaɪnəl tɜːrn/", "Tập xoay cột sống trong tầm dễ chịu."], "steps": [["Sit on a cushion with both legs folded left.", "/sɪt ɑːn ə ˈkʊʃn wɪð boʊθ leɡz ˈfoʊldɪd left/", "Ngồi trên đệm, gập hai chân sang trái."], ["Keep both sides of your seat supported.", "/kiːp boʊθ saɪdz əv jɔːr siːt səˈpɔːrtɪd/", "Kê đỡ đều hai bên mông."], ["Rest your left hand on your right thigh.", "/rest jɔːr left hænd ɑːn jɔːr raɪt θaɪ/", "Đặt tay trái nhẹ lên đùi phải."], ["Turn right with your right hand behind you.", "/tɜːrn raɪt wɪð jɔːr raɪt hænd bɪˈhaɪnd juː/", "Xoay phải, tay phải đặt phía sau."]], "tips": [["Keep the twist small and your breath free.", "/kiːp ðə twɪst smɔːl ænd jɔːr breθ friː/", "Xoắn nhẹ, thở tự nhiên."], ["Repeat on the other side.", "/rɪˈpiːt ɑːn ðə ˈʌðər saɪd/", "Đổi bên tập tương tự."]], "note": "Phiên âm theo giọng Anh-Mỹ. Mẫu hoạt động theo khả năng. Nguồn và mức độ: xem hướng dẫn in kèm.", "img": "img/ad-61.jpg", "thumb": "img/ad-61-t.jpg"}, {"id": "TW-09", "n": 127, "cat": "Tư thế vặn xoắn", "deck": "van-xoan", "lvl": ["Coordination / variation", "Phối hợp, biến thể"], "en": "Sage Twist: Marichi", "vi": "Hiền nhân Marichi vặn xoắn", "ipa": "/seɪdʒ twɪst məˈriːtʃi/", "ben": ["Practise a comfortable spinal turn.", "/ˈpræktɪs ə ˈkʌmftərbl ˈspaɪnəl tɜːrn/", "Tập xoay cột sống trong tầm dễ chịu."], "steps": [["Sit with your left leg extended.", "/sɪt wɪð jɔːr left leɡ ɪkˈstendɪd/", "Ngồi, duỗi chân trái."], ["Bend your right knee with the foot beside your hip.", "/bend jɔːr raɪt niː wɪð ðə fʊt bɪˈsaɪd jɔːr hɪp/", "Gập gối phải, đặt chân cạnh hông phải."], ["Hug your right knee softly with your left arm.", "/hʌɡ jɔːr raɪt niː ˈsɔːftli wɪð jɔːr left ɑːrm/", "Tay trái ôm nhẹ gối phải."], ["Place your right hand behind you and turn right.", "/pleɪs jɔːr raɪt hænd bɪˈhaɪnd juː ænd tɜːrn raɪt/", "Đặt tay phải phía sau, xoay nhẹ sang phải."]], "tips": [["Keep your front foot inside the straight leg.", "/kiːp jɔːr frʌnt ay.", "/fɜːrst wiː wɔːrm ʌp, ðen wiː pleɪ/", "Trước hết khởi động, sau đó chúng ta chơi."], ["We will tell a yoga story.", "/wiː wɪl tel ə ˈjoʊɡə ˈstɔːri/", "Chúng ta sẽ kể một câu chuyện yoga."], ["Listen carefully to my words.", "/ˈlɪsn ˈkerfəli tuː maɪ wɜːrdz/", "Chú ý lắng nghe lời tôi nói nhé."], ["Watch me first, then try.", "/wɑːtʃ miː fɜːrst, ðen traɪ/", "Nhìn tôi làm trước, rồi chúng ta cùng thử."], ["Are you ready for a new pose?", "/ɑːr juː ˈredi fɔːr ə nuː poʊz/", "Bạn sẵn sàng cho tư thế mới chưa?"], ["This pose is easy and fun.", "/ðɪs poʊz ɪz ˈiːzi ænd fʌn/", "Tư thế này dễ và vui lắm."]]}, {"t": "Quy tắc lớp học", "lines": [["Listen to your body.", "/ˈlɪsn tuː jɔːr ˈbɑːdi/", "Hãy lắng nghe cơ thể của bạn."], ["Move slowly and gently.", "/muːv ˈsloʊli ænd ˈdʒentli/", "Di chuyển chậm và nhẹ nhàng."], ["Don't push too hard.", "/doʊnt pʊʃ tuː hɑːrd/", "Đừng cố quá sức."], ["Stop if it hurts.", "/stɑːp ɪf ɪt hɜːrts/", "Dừng lại nếu thấy đau."], ["Raise your hand if you need help.", "/reɪz jɔːr hænd ɪf juː niːd help/", "Giơ tay nếu bạn cần tôi giúp."], ["Be kind to your friends.", "/biː kaɪnd tuː jɔːr frendz/", "Hãy tử tế với mọi người trong lớp."], ["Please don't talk during practice.", "/pliːz doʊnt tɔːk ˈdʊrɪŋ ˈpræktɪs/", "Đừng nói chuyện trong lúc tập nhé."], ["Keep your hands to yourself.", "/kiːp jɔːr hændz tuː jɔːrˈself/", "Giữ tay của bạn cho riêng mình, đừng chạm vào người khác."], ["Walk, don't run on the mats.", "/wɔːk, doʊnt rʌn ɑːn ðə mæts/", "Đi bộ, đừng chạy trên thảm."], ["Yoga is not a race.", "/ˈjoʊɡə ɪz nɑːt ə reɪs/", "Yoga không phải là cuộc đua."]]}]}, {"t": "Hướng dẫn vào tư thế", "lines": [["Look at me. Copy my pose.", "/lʊk æt miː. ˈkɑːpi maɪ poʊz/", "Nhìn tôi nhé. Làm theo tư thế của tôi."], ["Slowly, slowly. Good job!", "/ˈsloʊli, ˈsloʊli. ɡʊd dʒɑːb/", "Từ từ thôi. Bạn làm tốt lắm!"], ["Hold it for five seconds. One, two, three, four, five.", "/hoʊld ɪt fɔːr faɪv ˈsekəndz. wʌn, tuː, θriː, fɔːr, faɪv/", "Giữ yên năm giây. Một, hai, ba, bốn, năm."]], "groups": [{"t": "Vào tư thế", "lines": [["Stand with your feet apart.", "/stænd wɪð jɔːr fiːt əˈpɑːrt/", "Đứng hai chân mở rộng."], ["Bring your feet together.", "/brɪŋ jɔːr fiːt təˈɡeðər/", "Đưa hai chân lại gần nhau."], ["Lift your right arm up.", "/lɪft jɔːr raɪt ɑːrm ʌp/", "Nâng tay phải lên."], ["Lift your left leg.", "/lɪft jɔːr left leɡ/", "Nhấc chân trái lên."], ["Put your hands on your hips.", "/pʊt jɔːr hændz ɑːn jɔːr hɪps/", "Đặt hai tay lên hông."], ["Bend your knees a little.", "/bend jɔːr niːz ə ˈlɪtl/", "Gập đầu gối một chút."], ["Reach your arms forward.", "/riːtʃ jɔːr ɑːrmz ˈfɔːrwərd/", "Đưa hai tay ra phía trước."], ["Step your right foot back.", "/step jɔːr raɪt fʊt bæk/", "Bước chân phải ra sau."], ["Get down on your hands and knees.", "/ɡet daʊn ɑːn jɔːr hændz ænd niːz/", "Quỳ xuống, chống hai tay và hai gối."], ["Lie down on your back.", "/laɪ daʊn ɑːn jɔːr bæk/", "Nằm xuống, lưng chạm sàn."]]}, {"t": "Giữ tư thế và thở", "lines": [["Hold the pose.", "/hoʊld ðə poʊz/", "Giữ tư thế nhé."], ["Stay here and breathe.", "/steɪ hɪr ænd briːð/", "Ở yên đây và hít thở."], ["Hold for three breaths.", "/hoʊld fɔːr θriː breθs/", "Giữ trong ba nhịp thở."], ["Count with me: one, two, three.", "/kaʊnt wɪð miː: wʌn, tuː, θriː/", "Đếm cùng tôi: một, hai, ba."], ["Keep breathing slowly.", "/kiːp ˈbriːðɪŋ ˈsloʊli/", "Tiếp tục thở chậm."], ["Breathe in as you lift up.", "/briːð ɪn æz juː lɪft ʌp/", "Hít vào khi nâng lên."], ["Breathe out as you lower down.", "/briːð aʊt æz juː ˈloʊər daʊn/", "Thở ra khi hạ xuống."], ["Stay still like a statue.", "/steɪ stɪl laɪk ə ˈstætʃuː/", "Đứng yên như một bức tượng."], ["Look at one spot in front of you.", "/lʊk æt wʌn spɑːt ɪn frʌnt əv juː/", "Nhìn vào một điểm phía trước."], ["Feel strong and steady.", "/fiːl strɔːŋ ænd ˈstedi/", "Cảm nhận cơ thể khỏe và vững."]]}, {"t": "Chỉnh sửa tư thế", "lines": [["Stand up straight.", "/stænd ʌp streɪt/", "Đứng thẳng lên."], ["Keep your back straight.", "/kiːp jɔːr bæk streɪt/", "Giữ lưng thẳng."], ["Relax your shoulders.", "/rɪˈlæks jɔːr ˈʃoʊldərz/", "Thả lỏng đôi vai."], ["Tuck your chin in a little.", "/tʌk jɔːr tʃɪn ɪn ə ˈlɪtl/", "Thu cằm vào một chút."], ["Lift your chest.", "/lɪft jɔːr tʃest/", "Nâng ngực lên."], ["Point your toes forward.", "/pɔɪnt jɔːr toʊz ˈfɔːrwərd/", "Hướng các ngón chân ra trước."], ["Press your feet into the floor.", "/pres jɔːr fiːt ˈɪntuː ðə flɔːr/", "Ấn hai bàn chân xuống sàn."], ["Straighten your arms.", "/ˈstreɪtn jɔːr ɑːrmz/", "Duỗi thẳng hai tay."], ["Move your foot a little closer.", "/muːv jɔːr fʊt ə ˈlɪtl ˈkloʊsər/", "Dịch bàn chân lại gần thêm một chút."], ["Let me help you with this pose.", "/let miː help juː wɪð ðɪs poʊz/", "Để tôi giúp bạn tư thế này nhé."]]}, {"t": "Chuyển tư thế và đổi bên", "lines": [["Now change sides.", "/naʊ tʃeɪndʒ saɪdz/", "Giờ đổi bên nhé."], ["Let's do the other side.", "/lets duː ði ˈʌðər saɪd/", "Chúng ta làm bên còn lại nào."], ["Slowly come back to standing.", "/ˈsloʊli kʌm bæk tuː ˈstændɪŋ/", "Từ từ trở về tư thế đứng."], ["Move into the next pose.", "/muːv ˈɪntuː ðə nekst poʊz/", "Chuyển sang tư thế tiếp theo."], ["Come down to your hands and knees.", "/kʌm daʊn tuː jɔːr hændz ænd niːz/", "Hạ xuống, chống tay và gối."], ["Turn to face the front.", "/tɜːrn tuː feɪs ðə frʌnt/", "Quay mặt về phía trước."], ["Turn your head to the left.", "/tɜːrn jɔːr hed tuː ðə left/", "Quay đầu sang trái."], ["Jump your feet together.", "/dʒʌmp jɔːr fiːt təˈɡeðər/", "Nhảy hai chân chụm lại."], ["Roll over onto your tummy.", "/roʊl ˈoʊvər ˈɑːntuː jɔːr ˈtʌmi/", "Lăn người nằm sấp."], ["Sit up slowly.", "/sɪt ʌp ˈsloʊli/", "Từ từ ngồi dậy."]]}, {"t": "Thả lỏng và kết thúc", "lines": [["Gently let go of the pose.", "/ˈdʒentli let ɡoʊ əv ðə poʊz/", "Nhẹ nhàng thả tư thế ra."], ["Shake out your arms and legs.", "/ʃeɪk aʊt jɔːr ɑːrmz ænd leɡz/", "Lắc nhẹ tay và chân."], ["Relax your whole body.", "/rɪˈlæks jɔːr hoʊl ˈbɑːdi/", "Thả lỏng toàn bộ cơ thể."], ["Rest in child's pose.", "/rest ɪn tʃaɪldz poʊz/", "Nghỉ ở tư thế em bé."], ["Lie down and close your eyes.", "/laɪ daʊn ænd kloʊz jɔːr aɪz/", "Nằm xuống và nhắm mắt lại."], ["Let your arms rest by your sides.", "/let jɔːr ɑːrmz rest baɪ jɔːr saɪdz/", "Để hai tay thả xuống bên người."], ["Feel the floor under your body.", "/fiːl ðə flɔːr ˈʌndər jɔːr ˈbɑːdi/", "Cảm nhận sàn nhà dưới cơ thể."], ["Be quiet and still for a moment.", "/biː ˈkwaɪət ænd stɪl fɔːr ə ˈmoʊmənt/", "Giữ yên lặng và bất động một lát."], ["Slowly wiggle your fingers and toes.", "/ˈsloʊli ˈwɪɡl jɔːr ˈfɪŋɡərz ænd toʊz/", "Từ từ cử động các ngón tay và ngón chân."], ["Open your eyes when you are ready.", "/ˈoʊpən jɔːr aɪz wen juː ɑːr ˈredi/", "Mở mắt ra khi bạn sẵn sàng."]]}]}, {"t": "Khen ngợi và động viên", "lines": [["Wonderful! You are so strong.", "/ˈwʌndərfəl! juː ɑːr soʊ strɔːŋ/", "Tuyệt vời! Bạn thật khỏe."], ["It's okay. Let's try again.", "/ɪts oʊˈkeɪ. lets traɪ əˈɡen/", "Không sao đâu. Chúng ta thử lại nhé."], ["Great balance!", "/ɡreɪt ˈbæləns/", "Giữ thăng bằng giỏi quá!"]], "groups": [{"t": "Khen ngợi", "lines": [["Well done!", "/wel dʌn/", "Làm tốt lắm!"], ["Excellent work!", "/ˈeksələnt wɜːrk/", "Xuất sắc!"], ["That's perfect!", "/ðæts ˈpɜːrfɪkt/", "Hoàn hảo!"], ["You did it!", "/juː dɪd ɪt/", "Bạn làm được rồi!"], ["I'm very proud of you.", "/aɪm ˈveri praʊd əv juː/", "Tôi rất tự hào về bạn."], ["What a beautiful pose!", "/wʌt ə ˈbjuːtɪfl poʊz/", "Tư thế đẹp quá!"], ["You look so strong!", "/juː lʊk soʊ strɔːŋ/", "Trông bạn khỏe quá!"], ["Fantastic job, everyone!", "/fænˈtæstɪk dʒɑːb, ˈevriwʌn/", "Cả lớp làm tuyệt vời!"], ["That was amazing!", "/ðæt wʌz əˈmeɪzɪŋ/", "Tuyệt vời quá!"], ["Give yourself a big clap!", "/ɡɪv jɔːrˈself ə bɪɡ klæp/", "Hãy tự vỗ tay khen bản thân nào!"]]}, {"t": "Động viên khi khó", "lines": [["Don't worry.", "/doʊnt ˈwɜːri/", "Đừng lo nhé."], ["It's hard, but you can do it.", "/ɪts hɑːrd, bʌt juː kæn duː ɪt/", "Khó đấy, nhưng bạn làm được."], ["Take your time.", "/teɪk jɔːr ta     M["top"]=sv(SQ+hs(24,24,72,18)); M["bottom"]=sv(SQ+hs(24,78,72,18)); M["left"]=sv(SQ+hs(24,24,18,72)); M["right"]=sv(SQ+hs(78,24,18,72));
    M["center"]=sv(SQ+hs(48,48,24,24)); M["edge"]=sv('<rect x="24" y="24" width="72" height="72" rx="4" fill="#e8f3f9" stroke="#e5484d" stroke-width="9"/>');
    M["side"]=sv('<polygon points="30,45 70,30 100,40 60,56" fill="#a9d8ee" '+K+'/><polygon points="30,45 60,56 60,100 30,88" fill="#5aa9d6" '+K+'/><polygon points="60,56 100,40 100,84 60,100" fill="#e5484d" fill-opacity=".9" '+K+'/>');
    var MATP='<polygon points="38,24 82,24 104,100 16,100" fill="#79bf5a" stroke="#4e9a30" stroke-width="2.5"/>';
    M["front of the mat"]=sv(MATP+'<polygon points="22,84 98,84 104,100 16,100" fill="#e5484d" fill-opacity=".9"/>');
    M["back of the mat"]=sv(MATP+'<polygon points="38,24 82,24 85,38 35,38" fill="#e5484d" fill-opacity=".9"/>');
    M["in the middle"]=sv(MATP+ball(60,62,11));
    return M;
  })();
  function vimg(p){ return p&&p.en?VIMG[p.en.toLowerCase()]:null; }

n class.", "/lɜːrn wʌn ˈsentəns təˈdeɪ ænd juːz ɪt ɪn klæs/", "Hôm nay hãy học một câu và dùng nó trong lớp.", "Động lực học tiếng Anh"], ["Your English will be better next month.", "/jɔːr ˈɪŋɡlɪʃ wɪl bi ˈbetər nekst mʌnθ/", "Tiếng Anh của bạn tháng sau sẽ tốt hơn.", "Động lực học tiếng Anh"], ["Keep showing up. That is how you win.", "/kiːp ˈʃoʊɪŋ ʌp ðæt ɪz haʊ juː wɪn/", "Cứ tiếp tục xuất hiện. Đó là cách bạn chiến thắng.", "Động lực học tiếng Anh"], ["Step by step, word by word.", "/step baɪ step wɜːrd baɪ wɜːrd/", "Từng bước, từng từ một.", "Động lực học tiếng Anh"], ["Learning English helps you guide more students.", "/ˈlɜːrnɪŋ ˈɪŋɡlɪʃ helps juː ɡaɪd mɔːr ˈstuːdnts/", "Học tiếng Anh giúp bạn hướng dẫn được nhiều học viên hơn.", "Động lực học tiếng Anh"], ["Ahimsa: Do no harm to yourself or to others.", "/əˈhɪmsɑː duː noʊ hɑːrm tuː jɔːrˈself ɔːr tuː ˈʌðərz/", "Ahimsa: Không làm tổn hại bản thân và người khác.", "Giới và luật trong yoga (Yama – Niyama)"], ["Satya: Speak the truth with kindness.", "/ˈsɑːtjə spiːk ðə truːθ wɪð ˈkaɪndnəs/", "Satya: Nói sự thật bằng lòng tử tế.", "Giới và luật trong yoga (Yama – Niyama)"], ["Asteya: Do not take what is not freely given.", "/əˈsteɪjə duː nɑːt teɪk wʌt ɪz nɑːt ˈfriːli ˈɡɪvn/", "Asteya: Không lấy những gì không được tự nguyện cho.", "Giới và luật trong yoga (Yama – Niyama)"], ["Brahmacharya: Use your energy wisely.", "/ˌbrɑːməˈtʃɑːrjə juːz jɔːr ˈenərdʒi ˈwaɪzli/", "Brahmacharya: Dùng năng lượng của mình một cách khôn ngoan.", "Giới và luật trong yoga (Yama – Niyama)"], ["Aparigraha: Hold on less and let go more.", "/əˌpærɪˈɡrɑːhə hoʊld ɑːn les ænd let ɡoʊ mɔːr/", "Aparigraha: Bám víu ít hơn và buông bỏ nhiều hơn.", "Giới và luật trong yoga (Yama – Niyama)"], ["Saucha: Keep your body, mind, and space clean.", "/ˈsaʊtʃə kiːp jɔːr ˈbɑːdi maɪnd ænd speɪs kliːn/", "Saucha: Giữ cơ thể, tâm trí và không gian của bạn sạch sẽ.", "Giới và luật trong yoga (Yama – Niyama)"], ["Santosha: Find contentment in what you have today.", "/ come when your body is ready.", "/bi ˈpeɪʃnt ðə poʊz wɪl kʌm wen jɔːr ˈbɑːdi ɪz ˈredi/", "Hãy kiên nhẫn. Tư thế sẽ đến khi cơ thể bạn sẵn sàng.", "Lời dạy yoga"], ["Practice what you teach and teach what you practice.", "/ˈpræktɪs wʌt juː tiːtʃ ænd tiːtʃ wʌt juː ˈpræktɪs/", "Hãy thực hành điều bạn dạy và dạy điều bạn thực hành.", "Lời dạy yoga"], ["Yoga begins where effort meets ease.", "/ˈjoʊɡə bɪˈɡɪnz wer ˈefərt miːts iːz/", "Yoga bắt đầu nơi nỗ lực gặp sự thư thái.", "Lời dạy yoga"], ["Every yoga teacher was once a nervous student.", "/ˈevri ˈjoʊɡə ˈtiːtʃər wʌz wʌns ə ˈnɜːrvəs ˈstuːdnt/", "Mọi giáo viên yoga đều từng là học viên đầy hồi hộp.", "Cảm hứng yoga"], ["Your calm helps your students feel safe.", "/jɔːr kɑːm helps jɔːr ˈstuːdnts fiːl seɪf/", "Sự bình tĩnh của bạn giúp học viên cảm thấy an toàn.", "Cảm hứng yoga"], ["Show up on the mat, even on the hard days.", "/ʃoʊ ʌp ɑːn ðə mæt ˈiːvn ɑːn ðə hɑːrd deɪz/", "Hãy có mặt trên thảm, kể cả những ngày khó khăn.", "Cảm hứng yoga"], ["Your breath is your best teacher.", "/jɔːr breθ ɪz jɔːr best ˈtiːtʃər/", "Hơi thở là người thầy tốt nhất của bạn.", "Cảm hứng yoga"], ["Each pose is a chance to grow stronger and softer.", "/iːtʃ poʊz ɪz ə tʃæns tuː ɡroʊ ˈstrɔːŋɡər ænd ˈsɔːftər/", "Mỗi tư thế là cơ hội để vừa mạnh hơn vừa mềm mại hơn.", "Cảm hứng yoga"], ["Smile, breathe, and go slowly.", "/smaɪl briːð ænd ɡoʊ ˈsloʊli/", "Mỉm cười, thở và đi chậm lại.", "Danh ngôn · Thích Nhất Hạnh"], ["Feelings come and go like clouds in a windy sky. Conscious breathing is my anchor.", "/ˈfiːlɪŋz kʌm ænd ɡoʊ laɪk klaʊdz ɪn ə ˈwɪndi skaɪ ˈkɑːnʃəs ˈbriːðɪŋ ɪz maɪ ˈæŋkər/", "Cảm xúc đến rồi đi như mây trên bầu trời gió. Hơi thở có ý thức là chiếc neo của tôi.", "Danh ngôn · Thích Nhất Hạnh"], ["Be kind whenever possible. It is always possible.", "/bi kaɪnd wenˈevər ˈpɑːsəbl ɪt ɪz ˈɔːlweɪz ˈpɑːsəbl/", "Hãy tử tế bất cứ khi nào có thể. Lúc nào cũng có thể.", "Danh ngôn · Đức Đạt Lai Lạt Ma"], ["Happiness is not something ready-made. It comes from your own actions.", "/ˈhæpinəs ɪz nɑːt ˈsʌmθɪŋ ˈredi meɪd ɪt kʌmz frʌm jɔːr oʊn ˈækʃnz/", "Hạnh phúc không phải thứ có sẵn. Nó đến từ chính hành động của bạn.", "Danh ngôn · Đức Đạt Lai Lạt Ma"], ["Do the best you can until you know better. Then when you know better, do better.", "/duː ðə best juː kæn ənˈtɪl juː noʊ ˈbetər ðen wen juː noʊ ˈbetər duː ˈbetər/", "Hãy làm hết sức mình cho đến khi bạn biết điều tốt hơn. Khi đã biết, hãy làm tốt hơn.", "Danh ngôn · Maya Angelou"], ["It always seems impossible until it is done.", "/ɪt ˈɔːlweɪz siːmz ɪmˈpɑːsəbl ənˈtɪl ɪt ɪz dʌn/", "Việc gì cũng có vẻ bất khả thi cho đến khi nó được làm xong.", "Danh ngôn · Nelson Mandela"], ["Realize deeply that the present moment is all you ever have.", "/ˈriːəlaɪz ˈdiːpli ðæt ðə ˈpreznt ˈmoʊmənt ɪz ɔːl juː ˈevər hæv/", "Hãy hiểu sâu rằng khoảnh khắc hiện tại là tất cả những gì bạn có.", "Danh ngôn · Eckhart Tolle"], ["You cannot stop the waves, but you can learn to surf.", "/juː ˈkænɑːt stɑːp ðə weɪvz bʌt juː kæn lɜːrn tuː sɜːrf/", "Bạn không thể ngăn sóng, nhưng bạn có thể học cách lướt sóng.", "Danh ngôn · Jon Kabat-Zinn"], ["If you change the way you look at things, the things you look at change.", "/ɪf juː tʃeɪndʒ ðə weɪ juː lʊk æt θɪŋz ðə θɪŋz juː lʊk æt tʃeɪndʒ/", "Nếu bạn thay đổi cách nhìn sự vật, thì sự vật bạn nhìn cũng thay đổi.", "Danh ngôn · Wayne Dyer"], ["Live quietly in the moment and see the beauty of all before you.", "/lɪv ˈkwaɪətli ɪn ðə ˈmoʊmənt ænd siː ðə ˈbjuːti əv ɔːl bɪˈfɔːr juː/", "Hãy sống lặng lẽ trong khoảnh khắc và nhìn thấy vẻ đẹp của mọi thứ trước mặt.", "Danh ngôn · Paramahansa Yogananda"], ["It does not matter how slowly you go as long as you do not stop.", "/ɪt dʌz nɑːt ˈmætər haʊ ˈsloʊli juː ɡoʊ æz lɔːŋ æz juː duː nɑːt stɑːp/", "Đi chậm đến đâu cũng không sao, miễn là bạn không dừng lại.", "Danh ngôn · Khổng Tử"], ["He who knows he has enough is rich.", "/hi huː noʊz hi hæz ɪˈnʌf ɪz rɪtʃ/", "Người biết đủ là người giàu có.", "Danh ngôn · Lão   function pickQuote(){
    var n = QUOTES.length, last = -1;
    try{ last = parseInt(localStorage.getItem("sykLastQuote"),10); if(isNaN(last)) last=-1; }catch(e){}
    var i = Math.floor(Math.random()*n); if(i===last) i=(i+1+Math.floor(Math.random()*(n-1)))%n;
    S.qi = i; try{ localStorage.setItem("sykLastQuote", String(i)); }catch(e){}
  }
  function homeView(){
 if(S.qi===undefined||S.qi===null) pickQuote(); var q = QUOTES[S.qi % QUOTES.length];
    return '<div class="stack"><div><h1>Chào '+esc(S.user.name)+'</h1><p class="muted">Hôm nay bạn muốn học phần nào?</p></div>'+

        '<button class="tile b" data-go="tro-choi"><h3>Trò chơi từ vựng</h3><p>Nghe, nhìn ảnh, nói và được chấm điểm</p></button>'+

        '<button class="tile a" data-go="the-yoga"><h3>Thẻ yoga</h3><p>'+S.decks.length+' bộ thẻ · '+all().length+' thẻ song ngữ</p></button>'+

  function thumbOf(p){ return p.thumb||p.img; }
  function cardTile(p,i){
    var dk = S.decks[S.deck], tr = dk && dk.tileRatio ? ' style="aspect-ratio:'+dk.tileRatio+'"' : '';
    var top = p.img ? '<img src="'+esc(thumbOf(p))+'" alt="" loading="lazy" decoding="async"'+tr+'>' : '<div class="ph t'+(i%4)+'"><span>'+esc((p.en||"?").charAt(0))+'</span></div>';
    var sw = p.hex ? '<i class="sw" style="background:'+esc(p.hex)+'"></i>' : '';
    var sub = p.colEn ? esc(p.colEn)+' · '+esc(p.colVi) : (p.n ? ('0'+p.n).slice(-2)+' · '+esc(p.vi) : esc(p.vi));
    return '<button class="card" data-sel="'+i+'"'+(p.border?' style="border:2px solid '+esc(p.border)+'"':'')+'>'+top+'<div class="meta"><b>'+esc(p.en)+'</b><span class="small muted">'+sw+sub+'</span></div></button>';
  }

  function coverOf(d){
    var imgs = d.cover ? d.cover.map(function(i){return d.cards[i];}).filter(function(c){return c&&c.img;}) : d.cards.filter(function(c){return c.img;}).slice(0,4);
    if(!imgs.length) return '<div class="ph txt t0">'+esc(d.t)+'</div>';
    return '<div class="cover" style="grid-template-columns:repeat('+imgs.length+',1fr)">'+imgs.map(function(c){return '<img src="'+esc(thumbOf(c))+'" alt="" loading="lazy" decoding="async">';}).join('')+'</div>';
  }

        return out; })()+

  }

  function cardsView(){
    if(S.deck===null || !S.decks[S.deck]) return decksView();
    var deck = S.decks[S.deck], list = deck.cards;
    var vis = []; list.forEach(function(p,i){ if(!deck.cats || S.cat==='' || p.cat===S.cat) vis.push(i); });
    if(S.sel!==null && list[S.sel]){

      var pos = vis.indexOf(S.sel); if(pos<0){ vis=[S.sel]; pos=0; }
      var sec = function(t,inner){ return '<div class="sec"><h3>'+t+'</h3>'+inner+'</div>'; };

          (p.play ? sec('Vừa chơi vừa học · Play &amp; learn', trio(p.play[0],p.play[1],p.play[2])) : '') +

          (p.note ? '<p class="small muted">'+esc(p.note)+'</p>' : trio('Adjust to each child. Stop for pain or dizziness.','/əˈdʒʌst tuː iːtʃ tʃaɪld. stɑːp fɔːr peɪn ɔːr ˈdɪzinəs/','Điều chỉnh theo khả năng. Dừng nếu đau hoặc chóng mặt.'));
      } else if(p.cueEn){ more = trio(p.cueEn,p.cueIpa,p.cueVi); }
      else { more = '<p class="muted">Thẻ này chưa có nội dung mặt sau.</p>'; }
      var sub = (p.colEn ? esc(p.colEn)+' '+esc(p.colIpa||'')+' · '+esc(p.colVi)+' — ' : '')+esc(p.vi);
      var chips = [];
      if(p.breath) chips.push((p.total?('0'+p.n).slice(-2)+'/'+p.total+' · ':'')+p.breath[2]+' · '+p.breath[0]+' '+p.breath[1]);

      if(p.lvl) chips.push(p.lvl[1]+' · '+p.lvl[0]);
      var chipRow = chips.length ? '<div class="row">'+chips.map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('')+'</div>' : '';
      var fimg = p.img ? '<img src="'+esc(p.img)+'" alt="" decoding="async">' : '<div class="ph t'+(S.sel%4)+'"><span>'+esc(p.en.charAt(0))+'</span></div>';
      var bd = p.border ? ' style="border:3px solid '+esc(p.border)+'"' : '';
      var title = '<h2>'+esc(p.en)+'</h2>'+(p.ipa?'<p class="ipa">'+esc(p.ipa)+'</p>':'')+'<p class="muted">'+sub+'</p>';
      var front = '<div class="face front"'+bd+' aria-hidden="'+(S.flip?'true':'false')+'"><div class="fimg">'+fimg+'</div>'+
        '<div class="ftext"><div>'+title+'</div>'+chipRow+
        '<div class="row"><button class="btn small-btn" data-say="'+esc(p.en)+'">Nghe tên tư thế</button>'+
        (p.cueEn?'<button class="btn small-btn ghost" data-say="'+esc(p.cueEn)+'">Nghe lời hô</button>':'')+'</div>'+
        '<p class="small muted">Chạm vào thẻ để lật sang mặt sau. Vuốt trái hoặc phải để đổi thẻ.</p></div></div>';
      var back = '<div class="face back"'+bd+' aria-hidden="'+(S.flip?'false':'true')+'"><div class="bpad"><div class="bhead"><h3>'+esc(p.en)+'</h3><p class="ipa">'+esc(p.ipa||'')+'</p><p class="muted small">'+sub+'</p></div>'+chipRow+more+

    }
    var filters = '', shown = list.map(function(p,i){ return {p:p,i:i}; });
    if(deck.cats){
      filters = '<div class="fchips"><button class="fchip" data-cat="" aria-pressed="'+(S.cat===''?'true':'false')+'">Tất cả · '+list.length+'</button>'+

          return '<button class="fchip" data-cat="'+esc(c)+'" aria-pressed="'+(S.cat===c?'true':'false')+'">'+esc(c.replace('Tư thế ',''))+' · '+n+'</button>'; }).join('')+'</div>';

  /* ---------- trò chơi từ vựng ---------- */
  function posePool(){ var seen={},r=[]; all().forEach(function(c){ var k=(c.en||'').toLowerCase(); if(!seen[k]){ seen[k]=1; r.push(c); } }); return r; }
  function pool(mode){
    var t=S.gtopics, r=[];
    if(t.indexOf("all")>=0 || t.indexOf("poses")>=0) r=r.concat(posePool());
    VPOOL.forEach(function(w){ if(t.indexOf("all")>=0 || t.indexOf(w.topic)>=0) r.push(w); });
    var seen={},u=[]; r.forEach(function(c){ var k=c.en.toLowerCase(); if(!seen[k]){ seen[k]=1; u.push(c); } });
    if(mode==="pic") u=u.filter(hasPic);
    return u;
  }
  function lev(a,b){ var m=a.length,n=b.length,d=[],i,j; for(i=0;i<=m;i++){ d[i]=[i]; } for(j=0;j<=n;j++) d[0][j]=j;
    for(i=1;i<=m;i++) for(j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); return d[m][n]; }
  function normW(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim(); }
  function scoreHeard(target, alts){
    var tg=normW(target), best=0, heard="";
    alts.forEach(function(x){ var h=normW(x.t); if(!h) return; var sim=1-lev(tg,h)/Math.max(tg.length,h.length,1);
      var sc = (h===tg) ? Math.round(80+20*(x.c>0?x.c:0.9)) : Math.round(sim*70);
      if(sc>best){ best=sc; heard=x.t; } });
    return {pct:best, heard:heard||(alts[0]&&alts[0].t)||""};
  }
  function startRec(qq){
    var SR = window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ qq.state="err"; qq.msg="Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy mở app bằng Chrome trên Android hoặc Safari trên iPhone."; render(); return; }
    var cur=qq.order[qq.i], got=false, r;
    try{ r=new SR(); }catch(e){ qq.state="err"; qq.msg="Không khởi động được micro."; render(); return; }
    r.lang="en-US"; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
    r.onresult=function(ev){
      got=true; var res=ev.results[0], alts=[], k; for(k=0;k<res.length;k++) alts.push({t:res[k].transcript,c:res[k].confidence});
      if(!S.quiz||S.quiz!==qq) return;
      var sc=scoreHeard(cur.en,alts); qq.pct=sc.pct; qq.heard=sc.heard; qq.state="scored";
      var i=qq.i; qq.best[i]=Math.max(qq.best[i]||0,sc.pct); render();
    };
    r.onerror=function(ev){
      if(!S.quiz||S.quiz!==qq||got) return; got=true; qq.state="err";
      var c=ev&&ev.error;
      qq.msg = (c==="not-allowed"||c==="service-not-allowed") ? "App chưa được phép dùng micro. Hãy cho phép micro cho trình duyệt, hoặc mở app trực tiếp bằng Chrome." :
               (c==="no-speech") ? "Chưa nghe thấy giọng. Hãy nói gần micro hơn rồi thử lại." :
               (c==="network") ? "Cần có mạng để nhận giọng nói." : "Chưa nghe được. Hãy thử lại.";
      render();
    };
    r.onend=function(){ if(!got && S.quiz===qq && qq.state==="rec"){ qq.state="err"; qq.msg="Chưa nghe thấy giọng. Hãy nói gần micro hơn rồi thử lại."; render(); } };
    qq.state="rec"; render();
    try{ r.start(); }catch(e){ qq.state="err"; qq.msg="Không khởi động được micro."; render(); }
  }
  function startGame(mode){
    var pl = pool(mode);
    if(pl.length<3){ toast(mode==="listen" ? "Hãy chọn thêm chủ đề để có đủ từ." : "Chủ đề này chưa có hình. Hãy chọn thêm: tư thế, bộ phận cơ thể, nội tạng, dụng cụ hoặc vị trí."); S.quiz=null; return; }
    /* mỗi lượt 10 từ; chơi tiếp thì lấy từ khác, chưa lặp lại cho đến khi hết kho */
    S.seen = S.seen||{}; var sk = mode+"|"+S.gtopics.join(",");
    var used = S.seen[sk]||[]; var fresh = pl.filter(function(c){ return used.indexOf(c.en)<0; });
    if(fresh.length<Math.min(10,pl.length)){ used=[]; fresh=pl.slice(); }
    var order = shuffle(fresh).slice(0,10);
    S.seen[sk] = used.concat(order.map(function(c){return c.en;}));
    S.quiz = {mode:mode, order:order, i:0, score:0, picked:null, opts:null, done:false, state:"idle", pct:null, tries:0, best:[]};
    makeOpts();
  }
  function makeOpts(){
    var q=S.quiz, cur=q.order[q.i];
    var others = shuffle(pool(q.mode).filter(function(p){return p!==cur;})).slice(0,2);
    q.opts = shuffle([cur].concat(others));
  }
  function finish(){
    var q=S.quiz; q.done=true;
    if(q.mode==="speak"){
      var sum=0; q.best.forEach(function(v){sum+=v;}); q.avg=Math.round(sum/q.order.length);
      addProgress(Math.round(q.avg/10));
    } else {
      q.avg=Math.round(q.score/q.order.length*100);
      addProgress(q.score*10);
    }
  }

      return '<div class="stack"><h1>Trò chơi từ vựng</h1><p class="muted">Chọn chủ đề từ vựng, rồi chọn trò chơi. Chơi xong được cộng điểm và giữ chuỗi ngày học.</p>'+

    }
    var q=S.quiz;

      var msg = q.avg>=80 ? "Rất tốt!" : (q.avg>=50 ? "Khá rồi, chơi lại để cao hơn." : "Chơi lại để quen từ hơn nhé.");
      return '<div class="stack"><h1>Xong rồi!</h1><div class="panel stack"><div class="pct">'+q.avg+'%</div><p class="'+(q.avg>=80?'ok':'muted')+'">'+msg+'</p>'+
        '<p class="small muted">'+(q.mode==="speak"?'Điểm phát âm trung bình (mô phỏng)':q.score+' / '+q.order.length+' từ đúng')+'</p>'+
        '<div class="row"><button class="btn" data-game="'+q.mode+'">Chơi tiếp 10 từ mới</button><button class="btn ghost" data-a="quiz-exit">Chọn trò khác</button></div></div></div>';
    }
    var cur=q.order[q.i];
    var head = '<div class="row between"><h1>'+GAMES[q.mode].t+'</h1><span class="chip">Từ '+(q.i+1)+'/'+q.order.length+'</span></div>'+
      '<div class="progress" aria-hidden="true"><i style="width:'+(q.i/q.order.length*100)+'%"></i></div>';

    if(q.mode==="speak"){
      var body = (hasPic(cur)?pic(cur,q.i):'')+'<div class="row between"><div><div class="word">'+esc(cur.en)+'</div>'+(cur.ipa?'<div class="ipa">'+esc(cur.ipa)+'</div>':'')+(cur.vi?'<div class="small muted">'+esc(cur.vi)+'</div>':'')+'</div><button class="btn small-btn ghost" data-say="'+esc(cur.en)+'">Nghe mẫu</button></div>';
      if(q.state==="idle"){
        body += '<p class="muted">'+(q.tries?'Thử lại lần '+(q.tries+1)+'. ':'')+'Bấm ghi âm rồi đọc to từ trên.</p><div><button class="btn" data-a="rec">Ghi âm</button></div>';
      } else if(q.state==="rec"){
        body += '<div class="rec" role="status"><span class="dot"></span>Đang nghe... hãy đọc to từ trên.</div>';
      } else if(q.state==="scored"){
        var good = q.pct>=80;
        body += '<div class="panel stack"><div class="pct">'+q.pct+'%</div><p class="'+(good?'ok':'muted')+'">'+(good?'Phát âm tốt!':'Gần được rồi, thử nói lại nhé.')+'</p>'+
          '<p class="small muted">Máy nghe được: <b>'+esc(q.heard||"")+'</b></p>'+
          '<div class="row"><button class="btn ghost" data-a="retry">Nói lại</button><button class="btn" data-a="next-speak">'+(q.i+1>=q.order.length?'Xem kết quả':'Từ tiếp')+'</button></div></div>';
      } else {
        body += '<div class="panel stack"><p class="err">'+esc(q.msg||"Chưa nghe được. Hãy thử lại.")+'</p>'+
          '<div class="row"><button class="btn ghost" data-a="retry">Thử lại</button><button class="btn" data-a="next-speak">'+(q.i+1>=q.order.length?'Xem kết quả':'Bỏ qua từ này')+'</button></div></div>';
      }
      body += '<div class="note">Điểm dựa trên việc điện thoại nghe và nhận ra từ bạn đọc. Cần bật micro và có mạng. Đây là điểm tham khảo, không chấm từng âm.</div>';
      return '<div class="stack">'+head+body+'</div>';
    }

    var opts=q.opts.map(function(p,k){
      var cls="opt";
      if(q.picked!==null){ if(p===cur) cls+=" right"; else if(k===q.picked) cls+=" wrong"; }
      return '<button class="'+cls+'" data-pick="'+k+'"'+(q.picked!==null?' disabled':'')+'><span>'+esc(p.en)+(p.vi?' <span class="ovi">('+esc(p.vi)+')</span>':'')+'</span></button>';
    }).join('');
    var prompt = q.mode==="listen"
      ? '<div class="panel stack"><p class="muted">Nghe rồi chọn từ đúng.</p><div><button class="btn" data-say="'+esc(cur.en)+'">Nghe từ</button></div></div>'

        '<div class="row"><button class="btn small-btn ghost" data-say="'+esc(cur.en)+'">Nghe lại</button><button class="btn" data-a="quiz-next">'+(q.i+1>=q.order.length?'Xem kết quả':'Từ tiếp')+'</button></div></div>';
    }
    return '<div class="stack">'+head+prompt+'<div class="opts">'+opts+'</div>'+fb+'</div>';
  }
