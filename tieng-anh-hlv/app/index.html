  var SCR = {"meo-bo": ["Chuỗi Mèo – Bò", "Cat – Cow Flow", [["Come onto your hands and knees.", "/kʌm ˈɑːntuː jɔːr hændz ænd niːz/", "Vào tư thế bò bằng hai tay và hai gối."], ["Place your hands under your shoulders and your knees under your hips.", "/pleɪs jɔːr hændz ˈʌndər jɔːr ˈʃoʊldərz ænd jɔːr niːz ˈʌndər jɔːr hɪps/", "Đặt tay dưới vai và gối dưới hông."], ["Spread your fingers wide.", "/spred jɔːr ˈfɪŋɡərz waɪd/", "Xòe rộng các ngón tay."], ["Inhale, drop your belly and lift your chest. This is cow pose.", "/ɪnˈheɪl drɑːp jɔːr ˈbeli ænd lɪft jɔːr tʃest ðɪs ɪz kaʊ poʊz/", "Hít vào, hạ bụng và nâng ngực. Đây là tư thế con bò."], ["Look forward and keep your neck long.", "/lʊk ˈfɔːrwərd ænd kiːp jɔːr nek lɔːŋ/", "Nhìn về trước và giữ cổ dài."], ["Exhale, press the floor away and round your back. This is cat pose.", "/eksˈheɪl pres ðə flɔːr əˈweɪ ænd raʊnd jɔːr bæk ðɪs ɪz kæt poʊz/", "Thở ra, đẩy sàn ra xa và cong tròn lưng. Đây là tư thế con mèo."], ["Tuck your chin toward your chest.", "/tʌk jɔːr tʃɪn tɔːrd jɔːr tʃest/", "Thu cằm về phía ngực."], ["Move slowly with your breath.", "/muːv ˈsloʊli wɪð jɔːr breθ/", "Di chuyển chậm theo hơi thở."], ["Repeat five more times.", "/rɪˈpiːt faɪv mɔːr taɪmz/", "Lặp lại thêm năm lần."], ["Come back to a neutral spine and rest in child's pose.", "/kʌm bæk tuː ə ˈnuːtrəl spaɪn ænd rest ɪn tʃaɪldz poʊz/", "Trở về cột sống trung tính và nghỉ ở tư thế em bé."]]], "mat-trang": ["Chuỗi Chào mặt trăng", "Moon Salutation", [["Stand at the center of your mat with your feet wide.", "/stænd æt ðə ˈsentər əv jɔːr mæt wɪð jɔːr fiːt waɪd/", "Đứng giữa thảm, hai chân mở rộng."], ["Turn your toes out and bend your knees.", "/tɜːrn jɔːr toʊz aʊt ænd bend jɔːr niːz/", "Xoay các ngón chân ra ngoài và gập gối."], ["Inhale, raise your arms overhead and join your palms.", "/ɪnˈheɪl reɪz jɔːr ɑːrmz ˌoʊvərˈhed ænd dʒɔɪn jɔːr pɑːmz/", "Hít vào, giơ tay lên cao và chắp hai lòng bàn tay."], ["Exhale, lean gently to the right.", "/eksˈheɪl liːn ˈdʒentli tuː ðə raɪt/", "Thở ra, nghiêng nhẹ sang phải."], ["Inhale, come back to the center.", "/ɪnˈheɪl kʌm bæk tuː ðə ˈsentər/", "Hít vào, trở về giữa."], ["Exhale, lean gently to the left.", "/eksˈheɪl liːn ˈdʒentli tuː ðə left/", "Thở ra, nghiêng nhẹ sang trái."], ["Inhale, return to the center. Exhale, bring your hands to your heart.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər eksˈheɪl brɪŋ jɔːr hændz tuː jɔːr hɑːrt/", "Hít vào, về giữa. Thở ra, đưa hai tay về trước tim."], ["Exhale, sink into a goddess squat, keeping your knees over your ankles.", "/eksˈheɪl, sɪŋk ˈɪntuː ə ˈɡɑːdəs skwɑːt ˈkiːpɪŋ jɔːr niːz ˈoʊvər jɔːr ˈæŋklz/", "Thở ra, hạ xuống thế ngồi xổm nữ thần, giữ đầu gối thẳng trên cổ chân."], ["Hold for three breaths.", "/hoʊld fɔːr θriː breθs/", "Giữ ba hơi thở."], ["Inhale, straighten your legs and relax your shoulders.", "/ɪnˈheɪl, ˈstreɪtn jɔːr leɡz ænd rɪˈlæks jɔːr ˈʃoʊldərz/", "Hít vào, duỗi thẳng chân và thả lỏng vai."], ["Repeat the sequence two more times.", "/rɪˈpiːt ðə ˈsiːkwəns tuː mɔːr taɪmz/", "Lặp lại chuỗi thêm hai lần."]]], "ngan": ["Chuỗi yoga ngắn 10 phút", "Short 10-minute Flow", [["Begin in easy pose and take three deep breaths.", "/bɪˈɡɪn ɪn ˈiːzi poʊz ænd teɪk θriː diːp breθs/", "Bắt đầu ở tư thế dễ ngồi và hít sâu ba hơi."], ["Roll your neck slowly to each side.", "/roʊl jɔːr nek ˈsloʊli tuː iːtʃ saɪd/", "Xoay cổ chậm sang mỗi bên."], ["Come to hands and knees for cat and cow.", "/kʌm tuː hændz ænd niːz fɔːr kæt ænd kaʊ/", "Vào tư thế bò để tập mèo và bò."], ["Exhale, tuck your toes and lift your hips to downward dog.", "/eksˈheɪl, tʌk jɔːr toʊz ænd lɪft jɔːr hɪps tuː ˈdaʊnwərd dɔːɡ/", "Thở ra, gập các ngón chân và nâng hông lên tư thế chó úp mặt."], ["Exhale, walk your feet to your hands and fold forward.", "/eksˈheɪl, wɔːk jɔːr fiːt tuː jɔːr hændz ænd foʊld ˈfɔːrwərd/", "Thở ra, bước hai chân về phía tay và gập người về trước."], ["Inhale, roll up slowly to stand in mountain pose.", "/ɪnˈheɪl, roʊl ʌp ˈsloʊli tuː stænd ɪn ˈmaʊntn poʊz/", "Hít vào, từ từ cuộn người đứng lên ở tư thế ngọn núi."], ["Inhale, step your right foot back into warrior two.", "/ɪnˈheɪl, step jɔːr raɪt fʊt bæk ˈɪntuː ˈwɔːriər tuː/", "Hít vào, bước chân phải về sau vào tư thế chiến binh hai."], ["Breathe and hold for five breaths.", "/briːð ænd hoʊld fɔːr faɪv breθs/", "Thở và giữ năm hơi thở."], ["Inhale, straighten your legs and switch sides.", "/ɪnˈheɪl, ˈstreɪtn jɔːr leɡz ænd swɪtʃ saɪdz/", "Hít vào, duỗi thẳng chân và đổi bên."], ["Exhale, lie down on your back for the final rest.", "/eksˈheɪl, laɪ daʊn ɑːn jɔːr bæk fɔːr ðə ˈfaɪnl rest/", "Thở ra, nằm ngửa để nghỉ cuối buổi."]]], "thuyen": ["Tư thế cái thuyền · Navasana", "Boat Pose", [["Sit with your knees bent and your feet on the floor.", "/sɪt wɪð jɔːr niːz bent ænd jɔːr fiːt ɑːn ðə flɔːr/", "Ngồi gập gối, hai bàn chân đặt trên sàn."], ["Inhale, lean back a little and lengthen your spine.", "/ɪnˈheɪl, liːn bæk ə ˈlɪtl ænd ˈleŋkθən jɔːr spaɪn/", "Hít vào, ngả người ra sau một chút và kéo dài cột sống."], ["Inhale, lift your feet off the floor.", "/ɪnˈheɪl, lɪft jɔːr fiːt ɔːf ðə flɔːr/", "Hít vào, nhấc hai bàn chân khỏi sàn."], ["Bring your shins parallel to the floor.", "/brɪŋ jɔːr ʃɪnz ˈpærəlel tuː ðə flɔːr/", "Đưa ống chân song song với sàn."], ["Inhale, reach your arms forward.", "/ɪnˈheɪl, riːtʃ jɔːr ɑːrmz ˈfɔːrwərd/", "Hít vào, vươn hai tay về trước."], ["Keep your chest open and your back long.", "/kiːp jɔːr tʃest ˈoʊpən ænd jɔːr bæk lɔːŋ/", "Giữ ngực mở và lưng dài."], ["Breathe steadily. Hold for five breaths.", "/briːð ˈstedɪli hoʊld fɔːr faɪv breθs/", "Thở đều. Giữ năm hơi thở."], ["If it is too hard, hold the backs of your thighs.", "/ɪf ɪt ɪz tuː hɑːrd hoʊld ðə bæks əv jɔːr θaɪz/", "Nếu quá khó, hãy giữ phía sau đùi."], ["Exhale, lower your feet and rest.", "/eksˈheɪl, ˈloʊər jɔːr fiːt ænd rest/", "Thở ra, hạ chân xuống và nghỉ."]]], "cay": ["Tư thế cái cây · Vrksasana", "Tree Pose", [["Stand tall in mountain pose.", "/stænd tɔːl ɪn ˈmaʊntn poʊz/", "Đứng thẳng ở tư thế ngọn núi."], ["Shift your weight onto your left foot.", "/ʃɪft jɔːr weɪt ˈɑːntuː jɔːr left fʊt/", "Chuyển trọng lượng sang chân trái."], ["Inhale, lift your right foot and place the sole on your ankle, calf, or inner thigh.", "/ɪnˈheɪl, lɪft jɔːr raɪt fʊt ænd pleɪs ðə soʊl ɑːn jɔːr ˈæŋkl kæf ɔːr ˈɪnər θaɪ/", "Hít vào, nhấc chân phải, đặt lòng bàn chân lên cổ chân, bắp chân hoặc đùi trong."], ["Do not press on your knee.", "/duː nɑːt pres ɑːn jɔːr niː/", "Không ấn lên đầu gối."], ["Press your foot and your leg into each other.", "/pres jɔːr fʊt ænd jɔːr leɡ ˈɪntuː iːtʃ ˈʌðər/", "Ấn bàn chân và chân vào nhau."], ["Bring your palms together at your heart.", "/brɪŋ jɔːr pɑːmz təˈɡeðər æt jɔːr hɑːrt/", "Chắp hai tay trước tim."], ["Find a point to look at and stay steady.", "/faɪnd ə pɔɪnt tuː lʊk æt ænd steɪ ˈstedi/", "Tìm một điểm để nhìn và giữ vững."], ["Inhale, reach your arms up like branches.", "/ɪnˈheɪl, riːtʃ jɔːr ɑːrmz ʌp laɪk ˈbræntʃɪz/", "Hít vào, vươn hai tay lên như cành cây."], ["Breathe, then change sides.", "/briːð ðen tʃeɪndʒ saɪdz/", "Thở, rồi đổi bên."]]], "thien": ["Bài dẫn thiền ngắn", "Short Guided Meditation", [["Find a comfortable seat and close your eyes.", "/faɪnd ə ˈkʌmftərbl siːt ænd kloʊz jɔːr aɪz/", "Tìm tư thế ngồi thoải mái và nhắm mắt."], ["Let your hands rest on your knees.", "/let jɔːr hændz rest ɑːn jɔːr niːz/", "Để hai tay nghỉ trên gối."], ["Sit tall and soften your face.", "/sɪt tɔːl ænd ˈsɔːfn jɔːr feɪs/", "Ngồi thẳng và làm mềm khuôn mặt."], ["Take a deep breath in through your nose.", "/teɪk ə diːp breθ ɪn θruː jɔːr noʊz/", "Hít sâu bằng mũi."], ["Slowly breathe out through your mouth.", "/ˈsloʊli briːð aʊt θruː jɔːr maʊθ/", "Từ từ thở ra bằng miệng."], ["Let your breath return to its natural rhythm.", "/let jɔːr breθ rɪˈtɜːrn tuː ɪts ˈnætʃrəl ˈrɪðəm/", "Để hơi thở trở về nhịp tự nhiên."], ["Notice the air moving in and out.", "/ˈnoʊtɪs ði er ˈmuːvɪŋ ɪn ænd aʊt/", "Để ý hơi thở đi vào và đi ra."], ["If your mind wanders, gently bring it back to your breath.", "/ɪf jɔːr maɪnd ˈwɑːndərz ˈdʒentli brɪŋ ɪt bæk tuː jɔːr breθ/", "Nếu tâm trí lang thang, nhẹ nhàng đưa nó về hơi thở."], ["There is nothing to fix and nowhere to go.", "/ðer ɪz ˈnʌθɪŋ tuː fɪks ænd ˈnoʊwer tuː ɡoʊ/", "Không có gì cần sửa và không có nơi nào cần đến."], ["Scan your body from your head to your toes.", "/skæn jɔːr ˈbɑːdi frʌm jɔːr hed tuː jɔːr toʊz/", "Quét cơ thể từ đầu đến các ngón chân."], ["Rest here for a few more breaths.", "/rest hɪr fɔːr ə fjuː mɔːr breθs/", "Nghỉ ở đây thêm vài hơi thở."], ["Slowly deepen your breath and wiggle your fingers and toes.", "/ˈsloʊli ˈdiːpən jɔːr breθ ænd ˈwɪɡl jɔːr ˈfɪŋɡərz ænd toʊz/", "Từ từ làm sâu hơi thở và ngọ nguậy các ngón tay, ngón chân."], ["When you are ready, open your eyes.", "/wen juː ɑːr ˈredi ˈoʊpən jɔːr aɪz/", "Khi sẵn sàng, hãy mở mắt."], ["Thank yourself for taking this time.", "/θæŋk jɔːrˈself fɔːr ˈteɪkɪŋ ðɪs taɪm/", "Cảm ơn chính mình đã dành thời gian này."]]], "savasana": ["Thư giãn cuối buổi (Savasana)", "Final Relaxation", [["Lie down on your back and let your feet fall open.", "/laɪ daʊn ɑːn jɔːr bæk ænd let jɔːr fiːt fɔːl ˈoʊpən/", "Nằm ngửa và để hai bàn chân buông mở ra."], ["Rest your arms by your sides with your palms facing up.", "/rest jɔːr ɑːrmz baɪ jɔːr saɪdz wɪð jɔːr pɑːmz ˈfeɪsɪŋ ʌp/", "Đặt hai tay dọc thân, lòng bàn tay ngửa lên."], ["Close your eyes and let your breath be natural.", "/kloʊz jɔːr aɪz ænd let jɔːr breθ bi ˈnætʃrəl/", "Nhắm mắt và để hơi thở tự nhiên."], ["Relax your forehead, your jaw, and your shoulders.", "/rɪˈlæks jɔːr ˈfɔːrhed jɔːr dʒɔː ænd jɔːr ˈʃoʊldərz/", "Thả lỏng trán, hàm và vai."], ["Let your whole body feel heavy.", "/let jɔːr hoʊl ˈbɑːdi fiːl ˈhevi/", "Để toàn thân cảm thấy nặng và thả lỏng."], ["Stay here in stillness.", "/steɪ hɪr ɪn ˈstɪlnəs/", "Ở yên trong sự tĩnh lặng."], ["Slowly roll to your right side and come up to sit.", "/ˈsloʊli roʊl tuː jɔːr raɪt saɪd ænd kʌm ʌp tuː sɪt/", "Từ từ lăn sang bên phải và ngồi dậy."]]], "co": ["Chuỗi khởi động cổ", "Neck Warm-up", [["Sit or stand tall and relax your shoulders.", "/sɪt ɔːr stænd tɔːl ænd rɪˈlæks jɔːr ˈʃoʊldərz/", "Ngồi hoặc đứng thẳng và thả lỏng vai."], ["Take a deep breath in and out.", "/teɪk ə diːp breθ ɪn ænd aʊt/", "Hít vào sâu và thở ra."], ["Inhale, lift your chin and lengthen the back of your neck up.", "/ɪnˈheɪl lɪft jɔːr tʃɪn ænd ˈleŋkθən ðə bæk əv jɔːr nek ʌp/", "Hít vào, nâng cằm và kéo dài phía sau cổ lên cao."], ["Exhale, drop your head and bring your chin toward the notch of your throat.", "/eksˈheɪl drɑːp jɔːr hed ænd brɪŋ jɔːr tʃɪn tɔːrd ðə nɑːtʃ əv jɔːr θroʊt/", "Thở ra, cúi đầu và đưa cằm về phía hõm cổ."], ["Inhale, lift your head back to the center.", "/ɪnˈheɪl lɪft jɔːr hed bæk tuː ðə ˈsentər/", "Hít vào, nâng đầu trở về giữa."], ["Exhale, tilt your right ear toward your right shoulder.", "/eksˈheɪl tɪlt jɔːr raɪt ɪr tɔːrd jɔːr raɪt ˈʃoʊldər/", "Thở ra, nghiêng tai phải về phía vai phải."], ["Keep your left shoulder down.", "/kiːp jɔːr left ˈʃoʊldər daʊn/", "Giữ vai trái thả xuống."], ["Inhale, come back to the center.", "/ɪnˈheɪl kʌm bæk tuː ðə ˈsentər/", "Hít vào, trở về giữa."], ["Exhale, tilt your left ear toward your left shoulder.", "/eksˈheɪl tɪlt jɔːr left ɪr tɔːrd jɔːr left ˈʃoʊldər/", "Thở ra, nghiêng tai trái về phía vai trái."], ["Inhale, come back to the center.", "/ɪnˈheɪl kʌm bæk tuː ðə ˈsentər/", "Hít vào, trở về giữa."], ["Exhale, turn your head to look over your right shoulder.", "/eksˈheɪl tɜːrn jɔːr hed tuː lʊk ˈoʊvər jɔːr raɪt ˈʃoʊldər/", "Thở ra, quay đầu nhìn qua vai phải."], ["Inhale, return to the center. Exhale, turn to look over your left shoulder.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər eksˈheɪl tɜːrn tuː lʊk ˈoʊvər jɔːr left ˈʃoʊldər/", "Hít vào, trở về giữa. Thở ra, quay đầu nhìn qua vai trái."], ["Never force your neck. Stop if you feel pain.", "/ˈnevər fɔːrs jɔːr nek stɑːp ɪf juː fiːl peɪn/", "Đừng bao giờ ép cổ. Dừng lại nếu bạn thấy đau."]]], "sau-chieu": ["Chuỗi khởi động 6 chiều", "Six-Direction Warm-up", [["Stand with your feet hip-width apart.", "/stænd wɪð jɔːr fiːt hɪp wɪdθ əˈpɑːrt/", "Đứng hai chân rộng bằng hông."], ["Place your hands on your hips and breathe.", "/pleɪs jɔːr hændz ɑːn jɔːr hɪps ænd briːð/", "Đặt hai tay lên hông và thở."], ["Exhale, bend forward from your hips. This is direction one.", "/eksˈheɪl bend ˈfɔːrwərd frʌm jɔːr hɪps ðɪs ɪz dəˈrekʃn wʌn/", "Thở ra, gập người về trước từ khớp hông. Đây là hướng một."], ["Inhale, come up and lean back gently, lifting your chest. This is direction two.", "/ɪnˈheɪl kʌm ʌp ænd liːn bæk ˈdʒentli ˈlɪftɪŋ jɔːr tʃest ðɪs ɪz dəˈrekʃn tuː/", "Hít vào, đứng lên và ngả nhẹ ra sau, nâng ngực. Đây là hướng hai."], ["Inhale, return to the center. Exhale, bend to the right. This is direction three.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər eksˈheɪl bend tuː ðə raɪt ðɪs ɪz dəˈrekʃn θriː/", "Hít vào, về giữa. Thở ra, nghiêng sang phải. Đây là hướng ba."], ["Inhale, return to the center. Exhale, bend to the left. This is direction four.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər eksˈheɪl bend tuː ðə left ðɪs ɪz dəˈrekʃn fɔːr/", "Hít vào, về giữa. Thở ra, nghiêng sang trái. Đây là hướng bốn."], ["Inhale, lengthen your spine. Exhale, twist to the right. This is direction five.", "/ɪnˈheɪl ˈleŋkθən jɔːr spaɪn eksˈheɪl twɪst tuː ðə raɪt ðɪs ɪz dəˈrekʃn faɪv/", "Hít vào, kéo dài cột sống. Thở ra, xoay sang phải. Đây là hướng năm."], ["Inhale, return to the center. Exhale, twist to the left. This is direction six.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər eksˈheɪl twɪst tuː ðə left ðɪs ɪz dəˈrekʃn sɪks/", "Hít vào, về giữa. Thở ra, xoay sang trái. Đây là hướng sáu."], ["Inhale, return to the center and reach your arms up. Exhale, lower your hands to your heart.", "/ɪnˈheɪl rɪˈtɜːrn tuː ðə ˈsentər ænd riːtʃ jɔːr ɑːrmz ʌp eksˈheɪl ˈloʊər jɔːr hændz tuː jɔːr hɑːrt/", "Hít vào, về giữa và vươn hai tay lên. Thở ra, hạ hai tay về trước tim."], ["Repeat each direction three times, slowly.", "/rɪˈpiːt iːtʃ dəˈrekʃn θriː taɪmz ˈsloʊli/", "Lặp lại mỗi hướng ba lần, thật chậm."], ["Keep your knees soft and move with your breath.", "/kiːp jɔːr niːz sɔːft ænd muːv wɪð jɔːr breθ/", "Giữ đầu gối mềm và di chuyển theo hơi thở."]]], "p-meo": ["Tư thế con mèo · Marjaryasana", "Cat Pose", [["Come onto your hands and knees.", "/kʌm ˈɑːntuː jɔːr hændz ænd niːz/", "Vào tư thế bò bằng hai tay và hai gối."], ["Place your hands under your shoulders and your knees under your hips.", "/pleɪs jɔːr hændz ˈʌndər jɔːr ˈʃoʊldərz ænd jɔːr niːz ˈʌndər jɔːr hɪps/", "Đặt tay dưới vai, gối dưới hông."], ["Exhale and press the floor away.", "/eksˈheɪl ænd pres ðə flɔːr əˈweɪ/", "Thở ra và đẩy sàn ra xa."], ["Round your back toward the ceiling.", "/raʊnd jɔːr bæk tɔːrd ðə ˈsiːlɪŋ/", "Cong tròn lưng hướng lên trần nhà."], ["Tuck your chin and your tailbone.", "/tʌk jɔːr tʃɪn ænd jɔːr ˈteɪlboʊn/", "Thu cằm và xương cụt vào."], ["Hold for two breaths.", "/hoʊld fɔːr tuː breθs/", "Giữ hai hơi thở."], ["Inhale and return to a flat back.", "/ɪnˈheɪl ænd rɪˈtɜːrn tuː ə flæt bæk/", "Hít vào và trở về lưng phẳng."]]], "p-bo": ["Tư thế con bò · Bitilasana", "Cow Pose", [["Start on your hands and knees.", "/stɑːrt ɑːn jɔːr hændz ænd niːz/", "Bắt đầu ở tư thế bò."], ["Inhale and drop your belly toward the floor.", "/ɪnˈheɪl ænd drɑːp jɔːr ˈbeli tɔːrd ðə flɔːr/", "Hít vào và hạ bụng xuống sàn."], ["Lift your chest and your tailbone.", "/lɪft jɔːr tʃest ænd jɔːr ˈteɪlboʊn/", "Nâng ngực và xương cụt lên."], ["Look forward and keep your neck long.", "/lʊk ˈfɔːrwərd ænd kiːp jɔːr nek lɔːŋ/", "Nhìn về trước và giữ cổ dài."], ["Draw your shoulders away from your ears.", "/drɔː jɔːr ˈʃoʊldərz əˈweɪ frʌm jɔːr ɪrz/", "Kéo vai xa khỏi tai."], ["Press your hands into the floor.", "/pres jɔːr hændz ˈɪntuː ðə flɔːr/", "Ấn hai tay xuống sàn."], ["Exhale and come back to neutral.", "/eksˈheɪl ænd kʌm bæk tuː ˈnuːtrəl/", "Thở ra và trở về tư thế trung tính."]]], "p-cb1": ["Tư thế chiến binh 1 · Virabhadrasana I", "Warrior One", [["Step your left foot back about one leg's length.", "/step jɔːr left fʊt bæk əˈbaʊt wʌn leɡz leŋkθ/", "Bước chân trái ra sau khoảng một sải chân."], ["Turn your back foot out about forty-five degrees.", "/tɜːrn jɔːr bæk fʊt aʊt əˈbaʊt ˈfɔːrti faɪv dɪˈɡriːz/", "Xoay bàn chân sau ra ngoài khoảng bốn mươi lăm độ."], ["Exhale, bend your front knee over your ankle.", "/eksˈheɪl, bend jɔːr frʌnt niː ˈoʊvər jɔːr ˈæŋkl/", "Thở ra, gập gối trước thẳng trên cổ chân."], ["Square your hips toward the front of the mat.", "/skwer jɔːr hɪps tɔːrd ðə frʌnt əv ðə mæt/", "Xoay hông hướng thẳng về phía trước thảm."], ["Inhale and reach your arms overhead.", "/ɪnˈheɪl ænd riːtʃ jɔːr ɑːrmz ˌoʊvərˈhed/", "Hít vào và vươn hai tay lên cao."], ["Press your back heel down.", "/pres jɔːr bæk hiːl daʊn/", "Ấn gót chân sau xuống."], ["Lift your chest and gaze forward.", "/lɪft jɔːr tʃest ænd ɡeɪz ˈfɔːrwərd/", "Nâng ngực và nhìn về trước."], ["Hold for five breaths, then switch sides.", "/hoʊld fɔːr faɪv breθs ðen swɪtʃ saɪdz/", "Giữ năm hơi thở, rồi đổi bên."]]], "p-cb2": ["Tư thế chiến binh 2 · Virabhadrasana II", "Warrior Two", [["Step your feet wide apart.", "/step jɔːr fiːt waɪd əˈpɑːrt/", "Bước hai chân rộng ra."], ["Turn your right foot out ninety degrees.", "/tɜːrn jɔːr raɪt fʊt aʊt ˈnaɪnti dɪˈɡriːz/", "Xoay bàn chân phải ra ngoài chín mươi độ."], ["Turn your left toes in a little.", "/tɜːrn jɔːr left toʊz ɪn ə ˈlɪtl/", "Xoay các ngón chân trái vào một chút."], ["Exhale, bend your right knee over your ankle.", "/eksˈheɪl, bend jɔːr raɪt niː ˈoʊvər jɔːr ˈæŋkl/", "Thở ra, gập gối phải thẳng trên cổ chân."], ["Inhale, extend your arms out to the sides at shoulder height.", "/ɪnˈheɪl, ɪkˈstend jɔːr ɑːrmz aʊt tuː ðə saɪdz æt ˈʃoʊldər haɪt/", "Hít vào, duỗi hai tay sang hai bên ngang vai."], ["Gaze over your right fingertips.", "/ɡeɪz ˈoʊvər jɔːr raɪt ˈfɪŋɡərtɪps/", "Nhìn qua các đầu ngón tay phải."], ["Keep your shoulders relaxed.", "/kiːp jɔːr ˈʃoʊldərz rɪˈlækst/", "Giữ vai thả lỏng."], ["Hold for five breaths, then switch sides.", "/hoʊld fɔːr faɪv breθs ðen swɪtʃ saɪdz/", "Giữ năm hơi thở, rồi đổi bên."]]], "p-cb3": ["Tư thế chiến binh 3 · Virabhadrasana III", "Warrior Three", [["Start in warrior one with your right foot forward.", "/stɑːrt ɪn ˈwɔːriər wʌn wɪð jɔːr raɪt fʊt ˈfɔːrwərd/", "Bắt đầu từ chiến binh một, chân phải ở trước."], ["Shift your weight onto your front foot.", "/ʃɪft jɔːr weɪt ˈɑːntuː jɔːr frʌnt fʊt/", "Chuyển trọng lượng lên chân trước."], ["Exhale, hinge forward from your hips.", "/eksˈheɪl, hɪndʒ ˈfɔːrwərd frʌm jɔːr hɪps/", "Thở ra, gập người về trước từ khớp hông."], ["Inhale, lift your back leg up behind you.", "/ɪnˈheɪl, lɪft jɔːr bæk leɡ ʌp bɪˈhaɪnd juː/", "Hít vào, nâng chân sau lên phía sau."], ["Inhale, reach your arms forward or keep your hands at your heart.", "/ɪnˈheɪl, riːtʃ jɔːr ɑːrmz ˈfɔːrwərd ɔːr kiːp jɔːr hændz æt jɔːr hɑːrt/", "Hít vào, vươn tay về trước hoặc giữ tay trước tim."], ["Keep your hips level and your standing knee soft.", "/kiːp jɔːr hɪps ˈlevl ænd jɔːr ˈstændɪŋ niː sɔːft/", "Giữ hông ngang bằng và gối chân trụ mềm."], ["Hold for three breaths, then switch sides.", "/hoʊld fɔːr θriː breθs ðen swɪtʃ saɪdz/", "Giữ ba hơi thở, rồi đổi bên."]]], "p-cau": ["Tư thế cái cầu · Setu Bandha Sarvangasana", "Bridge Pose", [["Lie on your back and bend your knees.", "/laɪ ɑːn jɔːr bæk ænd bend jɔːr niːz/", "Nằm ngửa và gập gối."], ["Place your feet hip-width apart, close to your hips.", "/pleɪs jɔːr fiːt hɪp wɪdθ əˈpɑːrt kloʊs tuː jɔːr hɪps/", "Đặt hai chân rộng bằng hông, gần sát hông."], ["Rest your arms by your sides, palms down.", "/rest jɔːr ɑːrmz baɪ jɔːr saɪdz pɑːmz daʊn/", "Để tay dọc thân, lòng bàn tay úp xuống."], ["Inhale and press into your feet.", "/ɪnˈheɪl ænd pres ˈɪntuː jɔːr fiːt/", "Hít vào và ấn xuống hai bàn chân."], ["Lift your hips toward the ceiling.", "/lɪft jɔːr hɪps tɔːrd ðə ˈsiːlɪŋ/", "Nâng hông lên hướng trần nhà."], ["Keep your knees over your ankles.", "/kiːp jɔːr niːz ˈoʊvər jɔːr ˈæŋklz/", "Giữ gối thẳng trên cổ chân."], ["Hold for five breaths, then lower slowly.", "/hoʊld fɔːr faɪv breθs ðen ˈloʊər ˈsloʊli/", "Giữ năm hơi thở, rồi hạ xuống từ từ."]]], "p-trang": ["Tư thế trăng lưỡi liềm · Ardha Chandrasana (biến thể nghiêng người)", "Crescent Moon Pose", [["Stand tall with your feet together.", "/stænd tɔːl wɪð jɔːr fiːt təˈɡeðər/", "Đứng thẳng, hai chân khép lại."], ["Inhale and reach your arms overhead.", "/ɪnˈheɪl ænd riːtʃ jɔːr ɑːrmz ˌoʊvərˈhed/", "Hít vào và vươn hai tay lên cao."], ["Interlace your fingers and point your index fingers up.", "/ˌɪntərˈleɪs jɔːr ˈfɪŋɡərz ænd pɔɪnt jɔːr ˈɪndeks ˈfɪŋɡərz ʌp/", "Đan các ngón tay và chĩa hai ngón trỏ lên."], ["Exhale and lean to the right, like a crescent moon.", "/eksˈheɪl ænd liːn tuː ðə raɪt laɪk ə ˈkresnt muːn/", "Thở ra và nghiêng sang phải, như vầng trăng lưỡi liềm."], ["Keep both feet grounded.", "/kiːp boʊθ fiːt ˈɡraʊndɪd/", "Giữ hai bàn chân bám đất."], ["Lengthen the left side of your waist.", "/ˈleŋkθən ðə left saɪd əv jɔːr weɪst/", "Kéo dài bên eo trái."], ["Inhale to come up, then lean to the left.", "/ɪnˈheɪl tuː kʌm ʌp ðen liːn tuː ðə left/", "Hít vào để đứng thẳng lại, rồi nghiêng sang trái."]]], "p-kim": ["Tư thế xâu kim · Parsva Balasana", "Thread the Needle", [["Come onto your hands and knees.", "/kʌm ˈɑːntuː jɔːr hændz ænd niːz/", "Vào tư thế bò bằng hai tay và hai gối."], ["Inhale and lift your right arm to the ceiling.", "/ɪnˈheɪl ænd lɪft jɔːr raɪt ɑːrm tuː ðə ˈsiːlɪŋ/", "Hít vào và nâng tay phải lên trần nhà."], ["Exhale and thread your right arm under your left arm.", "/eksˈheɪl ænd θred jɔːr raɪt ɑːrm ˈʌndər jɔːr left ɑːrm/", "Thở ra và luồn tay phải xuống dưới tay trái."], ["Rest your right shoulder and your right ear on the floor.", "/rest jɔːr raɪt ˈʃoʊldər ænd jɔːr raɪt ɪr ɑːn ðə flɔːr/", "Đặt vai phải và tai phải xuống sàn."], ["Keep your hips over your knees.", "/kiːp jɔːr hɪps ˈoʊvər jɔːr niːz/", "Giữ hông thẳng trên đầu gối."], ["Press your left hand into the floor.", "/pres jɔːr left hænd ˈɪntuː ðə flɔːr/", "Ấn tay trái xuống sàn."], ["Breathe here for five breaths, then switch sides.", "/briːð hɪr fɔːr faɪv breθs ðen swɪtʃ saɪdz/", "Thở ở đây năm hơi thở, rồi đổi bên."]]], "p-ca": ["Tư thế con cá · Matsyasana", "Fish Pose", [["Lie on your back with your legs straight.", "/laɪ ɑːn jɔːr bæk wɪð jɔːr leɡz streɪt/", "Nằm ngửa, hai chân duỗi thẳng."], ["Slide your hands under your hips, palms down.", "/slaɪd jɔːr hændz ˈʌndər jɔːr hɪps pɑːmz daʊn/", "Luồn hai tay dưới hông, lòng bàn tay úp."], ["Press your elbows into the floor.", "/pres jɔːr ˈelboʊz ˈɪntuː ðə flɔːr/", "Ấn hai khuỷu tay xuống sàn."], ["Inhale and lift your chest.", "/ɪnˈheɪl ænd lɪft jɔːr tʃest/", "Hít vào và nâng ngực lên."], ["Gently lower the top of your head to the floor.", "/ˈdʒentli ˈloʊər ðə tɑːp əv jɔːr hed tuː ðə flɔːr/", "Nhẹ nhàng hạ đỉnh đầu xuống sàn."], ["Keep most of your weight on your elbows, not your head.", "/kiːp moʊst əv jɔːr weɪt ɑːn jɔːr ˈelboʊz nɑːt jɔːr hed/", "Dồn phần lớn trọng lượng vào khuỷu tay, không dồn vào đầu."], ["Hold for five breaths, then lift your head and lower your chest.", "/hoʊld fɔːr faɪv breθs ðen lɪft jɔːr hed ænd ˈloʊər jɔːr tʃest/", "Giữ năm hơi thở, rồi nâng đầu và hạ ngực xuống."]]], "p-vai": ["Tư thế đứng bằng vai · Salamba Sarvangasana", "Shoulder Stand", [["Only practice this pose if you have experience and no neck problems.", "/ˈoʊnli ˈpræktɪs ðɪs poʊz ɪf juː hæv ɪkˈspɪriəns ænd noʊ nek ˈprɑːbləmz/", "Chỉ tập tư thế này nếu bạn có kinh nghiệm và không có vấn đề ở cổ."], ["Fold a blanket and lie with your shoulders on it.", "/foʊld ə ˈblæŋkɪt ænd laɪ wɪð jɔːr ˈʃoʊldərz ɑːn ɪt/", "Gấp một chiếc chăn và nằm sao cho vai ở trên chăn."], ["Exhale, bend your knees and lift your hips.", "/eksˈheɪl, bend jɔːr niːz ænd lɪft jɔːr hɪps/", "Thở ra, gập gối và nâng hông lên."], ["Support your back with your hands.", "/səˈpɔːrt jɔːr bæk wɪð jɔːr hændz/", "Dùng hai tay đỡ lưng."], ["Inhale, slowly lift your legs toward the ceiling.", "/ɪnˈheɪl, ˈsloʊli lɪft jɔːr leɡz tɔːrd ðə ˈsiːlɪŋ/", "Hít vào, từ từ nâng hai chân lên hướng trần nhà."], ["Keep your neck still and do not turn your head.", "/kiːp jɔːr nek stɪl ænd duː nɑːt tɜːrn jɔːr hed/", "Giữ cổ yên và không xoay đầu."], ["Come down slowly if you feel any strain in your neck.", "/kʌm daʊn ˈsloʊli ɪf juː fiːl ˈeni streɪn ɪn jɔːr nek/", "Hạ xuống từ từ nếu bạn thấy căng ở cổ."]]], "p-dau": ["Tư thế đứng bằng đầu · Salamba Sirsasana", "Headstand", [["This is an advanced pose. Practice near a wall with guidance.", "/ðɪs ɪz ən ədˈvænst poʊz ˈpræktɪs nɪr ə wɔːl wɪð ˈɡaɪdns/", "Đây là tư thế nâng cao. Hãy tập gần tường và có người hướng dẫn."], ["Kneel and interlace your fingers.", "/niːl ænd ˌɪntərˈleɪs jɔːr ˈfɪŋɡərz/", "Quỳ xuống và đan các ngón tay."], ["Place your forearms on the floor and the crown of your head in your hands.", "/pleɪs jɔːr ˈfɔːrɑːrmz ɑːn ðə flɔːr ænd ðə kraʊn əv jɔːr hed ɪn jɔːr hændz/", "Đặt cẳng tay xuống sàn và đỉnh đầu vào lòng hai bàn tay."], ["Press your forearms down and lift your shoulders.", "/pres jɔːr ˈfɔːrɑːrmz daʊn ænd lɪft jɔːr ˈʃoʊldərz/", "Ấn cẳng tay xuống và nâng vai lên."], ["Exhale, walk your feet toward your head and lift your hips.", "/eksˈheɪl, wɔːk jɔːr fiːt tɔːrd jɔːr hed ænd lɪft jɔːr hɪps/", "Thở ra, bước chân về phía đầu và nâng hông lên."], ["Do not put too much weight on your head.", "/duː nɑːt pʊt tuː mʌtʃ weɪt ɑːn jɔːr hed/", "Không dồn quá nhiều trọng lượng lên đầu."], ["Come down slowly and rest in child's pose.", "/kʌm daʊn ˈsloʊli ænd rest ɪn tʃaɪldz poʊz/", "Hạ xuống từ từ và nghỉ ở tư thế em bé."]]], "p-nuthan": ["Tư thế nữ thần · Utkata Konasana", "Goddess Pose", [["Step your feet wide apart.", "/step jɔːr fiːt waɪd əˈpɑːrt/", "Bước hai chân rộng ra."], ["Turn your toes out to the sides.", "/tɜːrn jɔːr toʊz aʊt tuː ðə saɪdz/", "Xoay các ngón chân ra hai bên."], ["Exhale, bend your knees over your ankles.", "/eksˈheɪl, bend jɔːr niːz ˈoʊvər jɔːr ˈæŋklz/", "Thở ra, gập gối thẳng trên cổ chân."], ["Sink your hips down.", "/sɪŋk jɔːr hɪps daʊn/", "Hạ hông xuống."], ["Inhale, bring your arms up in a cactus shape.", "/ɪnˈheɪl, brɪŋ jɔːr ɑːrmz ʌp ɪn ə ˈkæktəs ʃeɪp/", "Hít vào, đưa hai tay lên thành hình xương rồng."], ["Keep your back straight and your chest open.", "/kiːp jɔːr bæk streɪt ænd jɔːr tʃest ˈoʊpən/", "Giữ lưng thẳng và ngực mở."], ["Hold for five breaths.", "/hoʊld fɔːr faɪv breθs/", "Giữ năm hơi thở."]]], "p-ghe": ["Tư thế cái ghế · Utkatasana", "Chair Pose", [["Stand with your feet together.", "/stænd wɪð jɔːr fiːt təˈɡeðər/", "Đứng hai chân khép lại."], ["Inhale and reach your arms overhead.", "/ɪnˈheɪl ænd riːtʃ jɔːr ɑːrmz ˌoʊvərˈhed/", "Hít vào và vươn hai tay lên cao."], ["Exhale and bend your knees as if you are sitting in a chair.", "/eksˈheɪl ænd bend jɔːr niːz æz ɪf juː ɑːr ˈsɪtɪŋ ɪn ə tʃer/", "Thở ra và gập gối như đang ngồi xuống ghế."], ["Send your hips back.", "/send jɔːr hɪps bæk/", "Đưa hông ra sau."], ["Keep your weight in your heels.", "/kiːp jɔːr weɪt ɪn jɔːr hiːlz/", "Dồn trọng lượng vào gót chân."], ["Lift your chest and lengthen your spine.", "/lɪft jɔːr tʃest ænd ˈleŋkθən jɔːr spaɪn/", "Nâng ngực và kéo dài cột sống."], ["Hold for five breaths.", "/hoʊld fɔːr faɪv breθs/", "Giữ năm hơi thở."]]], "p-gap": ["Tư thế ngồi gập người về trước · Paschimottanasana", "Seated Forward Fold", [["Sit with your legs straight in front of you.", "/sɪt wɪð jɔːr leɡz streɪt ɪn frʌnt əv juː/", "Ngồi, hai chân duỗi thẳng phía trước."], ["Flex your feet and press through your heels.", "/fleks jɔːr fiːt ænd pres θruː jɔːr hiːlz/", "Gập bàn chân về phía mình và ấn qua gót chân."], ["Inhale and lengthen your spine.", "/ɪnˈheɪl ænd ˈleŋkθən jɔːr spaɪn/", "Hít vào và kéo dài cột sống."], ["Exhale and fold forward from your hips.", "/eksˈheɪl ænd foʊld ˈfɔːrwərd frʌm jɔːr hɪps/", "Thở ra và gập người về trước từ khớp hông."], ["Hold your shins, ankles, or feet.", "/hoʊld jɔːr ʃɪnz ˈæŋklz ɔːr fiːt/", "Nắm ống chân, cổ chân hoặc bàn chân."], ["Bend your knees if your back is rounding.", "/bend jɔːr niːz ɪf jɔːr bæk ɪz ˈraʊndɪŋ/", "Gập gối nếu lưng bị cong tròn."], ["Hold for five breaths and breathe calmly.", "/hoʊld fɔːr faɪv breθs ænd briːð ˈkɑːmli/", "Giữ năm hơi thở và thở êm dịu."]]], "p-xoan": ["Tư thế ngồi vặn xoắn · Ardha Matsyendrasana", "Seated Twist", [["Sit tall with your legs straight.", "/sɪt tɔːl wɪð jɔːr leɡz streɪt/", "Ngồi thẳng, hai chân duỗi."], ["Bend your right knee and place your right foot outside your left thigh.", "/bend jɔːr raɪt niː ænd pleɪs jɔːr raɪt fʊt ˌaʊtˈsaɪd jɔːr left θaɪ/", "Gập gối phải và đặt bàn chân phải bên ngoài đùi trái."], ["Inhale and lengthen your spine.", "/ɪnˈheɪl ænd ˈleŋkθən jɔːr spaɪn/", "Hít vào và kéo dài cột sống."], ["Exhale and twist to the right.", "/eksˈheɪl ænd twɪst tuː ðə raɪt/", "Thở ra và xoay người sang phải."], ["Place your right hand behind you.", "/pleɪs jɔːr raɪt hænd bɪˈhaɪnd juː/", "Đặt tay phải phía sau lưng."], ["Hug your right knee with your left arm.", "/hʌɡ jɔːr raɪt niː wɪð jɔːr left ɑːrm/", "Dùng tay trái ôm gối phải."], ["Twist from your waist, not from your neck.", "/twɪst frʌm jɔːr weɪst nɑːt frʌm jɔːr nek/", "Xoay từ eo, không xoay từ cổ."], ["Hold for five breaths, then switch sides.", "/hoʊld fɔːr faɪv breθs ðen swɪtʃ saɪdz/", "Giữ năm hơi thở, rồi đổi bên."]]], "p-bocau": ["Tư thế bồ câu · Eka Pada Rajakapotasana", "Pigeon Pose", [["Start in downward dog.", "/stɑːrt ɪn ˈdaʊnwərd dɔːɡ/", "Bắt đầu từ tư thế chó úp mặt."], ["Bring your right knee forward behind your right wrist.", "/brɪŋ jɔːr raɪt niː ˈfɔːrwərd bɪˈhaɪnd jɔːr raɪt rɪst/", "Đưa gối phải lên trước, ở phía sau cổ tay phải."], ["Slide your left leg back and lower your hips.", "/slaɪd jɔːr left leɡ bæk ænd ˈloʊər jɔːr hɪps/", "Trượt chân trái ra sau và hạ hông xuống."], ["Keep your hips square.", "/kiːp jɔːr hɪps skwer/", "Giữ hông ngay ngắn."], ["Place a blanket under your hip if it feels tight.", "/pleɪs ə ˈblæŋkɪt ˈʌndər jɔːr hɪp ɪf ɪt fiːlz taɪt/", "Đặt một chiếc chăn dưới hông nếu thấy căng."], ["Exhale, fold forward and rest your forearms on the floor.", "/eksˈheɪl, foʊld ˈfɔːrwərd ænd rest jɔːr ˈfɔːrɑːrmz ɑːn ðə flɔːr/", "Thở ra, gập người về trước và đặt cẳng tay xuống sàn."], ["Breathe for eight breaths, then switch sides.", "/briːð fɔːr eɪt breθs ðen swɪtʃ saɪdz/", "Thở tám hơi thở, rồi đổi bên."]]], "p-ran": ["Tư thế rắn hổ mang · Bhujangasana", "Cobra Pose", [["Lie on your stomach with your legs straight.", "/laɪ ɑːn jɔːr ˈstʌmək wɪð jɔːr leɡz streɪt/", "Nằm sấp, hai chân duỗi thẳng."], ["Place your hands under your shoulders.", "/pleɪs jɔːr hændz ˈʌndər jɔːr ˈʃoʊldərz/", "Đặt hai tay dưới vai."], ["Press the tops of your feet into the floor.", "/pres ðə tɑːps əv jɔːr fiːt ˈɪntuː ðə flɔːr/", "Ấn mu bàn chân xuống sàn."], ["Inhale and lift your chest.", "/ɪnˈheɪl ænd lɪft jɔːr tʃest/", "Hít vào và nâng ngực lên."], ["Keep your elbows slightly bent.", "/kiːp jɔːr ˈelboʊz ˈslaɪtli bent/", "Giữ khuỷu tay hơi gập."], ["Draw your shoulders away from your ears.", "/drɔː jɔːr ˈʃoʊldərz əˈweɪ frʌm jɔːr ɪrz/", "Kéo vai xa khỏi tai."], ["Hold for three breaths, then lower slowly.", "/hoʊld fɔːr θriː breθs ðen ˈloʊər ˈsloʊli/", "Giữ ba hơi thở, rồi hạ xuống từ từ."]]], "p-cun": ["Tư thế cún con · Uttana Shishosana", "Puppy Pose", [["Come onto your hands and knees.", "/kʌm ˈɑːntuː jɔːr hændz ænd niːz/", "Vào tư thế bò bằng hai tay và hai gối."], ["Keep your hips over your knees.", "/kiːp jɔːr hɪps ˈoʊvər jɔːr niːz/", "Giữ hông thẳng trên đầu gối."], ["Walk your hands forward.", "/wɔːk jɔːr hændz ˈfɔːrwərd/", "Bước hai tay về phía trước."], ["Exhale, lower your chest toward the floor.", "/eksˈheɪl, ˈloʊər jɔːr tʃest tɔːrd ðə flɔːr/", "Thở ra, hạ ngực xuống gần sàn."], ["Rest your forehead or your chin on the floor.", "/rest jɔːr ˈfɔːrhed ɔːr jɔːr tʃɪn ɑːn ðə flɔːr/", "Đặt trán hoặc cằm xuống sàn."], ["Press your palms down and stretch your arms long.", "/pres jɔːr pɑːmz daʊn ænd stretʃ jɔːr ɑːrmz lɔːŋ/", "Ấn lòng bàn tay xuống và duỗi dài hai tay."], ["Hold for five breaths.", "/hoʊld fɔːr faɪv breθs/", "Giữ năm hơi thở."]]], "p-daibang": ["Tư thế đại bàng · Garudasana", "Eagle Pose", [["Stand tall and bend your knees slightly.", "/stænd tɔːl ænd bend jɔːr niːz ˈslaɪtli/", "Đứng thẳng và gập gối nhẹ."], ["Shift your weight onto your left foot.", "/ʃɪft jɔːr weɪt ˈɑːntuː jɔːr left fʊt/", "Chuyển trọng lượng sang chân trái."], ["Exhale, cross your right thigh over your left thigh.", "/eksˈheɪl, krɔːs jɔːr raɪt θaɪ ˈoʊvər jɔːr left θaɪ/", "Thở ra, bắt chéo đùi phải qua đùi trái."], ["Cross your right arm under your left arm.", "/krɔːs jɔːr raɪt ɑːrm ˈʌndər jɔːr left ɑːrm/", "Bắt chéo tay phải dưới tay trái."], ["Press your palms together.", "/pres jɔːr pɑːmz təˈɡeðər/", "Ép hai lòng bàn tay vào nhau."], ["Inhale, lift your elbows to shoulder height.", "/ɪnˈheɪl, lɪft jɔːr ˈelboʊz tuː ˈʃoʊldər haɪt/", "Hít vào, nâng khuỷu tay lên ngang vai."], ["Find a point to look at and stay steady.", "/faɪnd ə pɔɪnt tuː lʊk æt ænd steɪ ˈstedi/", "Tìm một điểm để nhìn và giữ vững."], ["Hold for five breaths, then switch sides.", "/hoʊld fɔːr faɪv breθs ðen swɪtʃ saɪdz/", "Giữ năm hơi thở, rồi đổi bên."]]], "p-canhcung": ["Tư thế cánh cung · Dhanurasana", "Bow Pose", [["Lie on your stomach with your arms by your sides.", "/laɪ ɑːn jɔːr ˈstʌmək wɪð jɔːr ɑːrmz baɪ jɔːr saɪdz/", "Nằm sấp, hai tay dọc thân."], ["Bend your knees and bring your heels toward your hips.", "/bend jɔːr niːz ænd brɪŋ jɔːr hiːlz tɔːrd jɔːr hɪps/", "Gập gối và đưa gót chân về phía hông."], ["Reach back and hold your ankles.", "/riːtʃ bæk ænd hoʊld jɔːr ˈæŋklz/", "Với tay ra sau và nắm cổ chân."], ["Inhale and lift your chest and your thighs.", "/ɪnˈheɪl ænd lɪft jɔːr tʃest ænd jɔːr θaɪz/", "Hít vào và nâng ngực và đùi lên."], ["Press your feet into your hands.", "/pres jɔːr fiːt ˈɪntuː jɔːr hændz/", "Đạp bàn chân vào hai tay."], ["Keep breathing and look forward.", "/kiːp ˈbriːðɪŋ ænd lʊk ˈfɔːrwərd/", "Tiếp tục thở và nhìn về trước."], ["Hold for three breaths, then release slowly.", "/hoʊld fɔːr θriː breθs ðen rɪˈliːs ˈsloʊli/", "Giữ ba hơi thở, rồi thả ra từ từ."]]], "p-lacda": ["Tư thế lạc đà · Ustrasana", "Camel Pose", [["Kneel with your knees hip-width apart.", "/niːl wɪð jɔːr niːz hɪp wɪdθ əˈpɑːrt/", "Quỳ, hai gối rộng bằng hông."], ["Place your hands on your lower back.", "/pleɪs jɔːr hændz ɑːn jɔːr ˈloʊər bæk/", "Đặt hai tay lên lưng dưới."], ["Inhale and lift your chest.", "/ɪnˈheɪl ænd lɪft jɔːr tʃest/", "Hít vào và nâng ngực."], ["Exhale and lean back gently.", "/eksˈheɪl ænd liːn bæk ˈdʒentli/", "Thở ra và ngả người ra sau nhẹ nhàng."], ["Reach for your heels if it feels comfortable.", "/riːtʃ fɔːr jɔːr hiːlz ɪf ɪt fiːlz ˈkʌmftərbl/", "Với tay chạm gót chân nếu thấy thoải mái."], ["Keep your neck long and do not drop your head back too far.", "/kiːp jɔːr nek lɔːŋ ænd duː nɑːt drɑːp jɔːr hed bæk tuː fɑːr/", "Giữ cổ dài và đừng ngửa đầu ra sau quá nhiều."], ["Come up slowly and rest in child's pose.", "/kʌm ʌp ˈsloʊli ænd rest ɪn tʃaɪldz poʊz/", "Từ từ đứng dậy và nghỉ ở tư thế em bé."]]], "p-xoac": ["Tư thế xoạc ngang · Samakonasana", "Side Splits", [["Warm up your hips and legs first.", "/wɔːrm ʌp jɔːr hɪps ænd leɡz fɜːrst/", "Hãy khởi động hông và chân trước."], ["Sit with your legs wide apart.", "/sɪt wɪð jɔːr leɡz waɪd əˈpɑːrt/", "Ngồi, hai chân mở rộng."], ["Keep your toes pointing up to the ceiling.", "/kiːp jɔːr toʊz ˈpɔɪntɪŋ ʌp tuː ðə ˈsiːlɪŋ/", "Giữ các ngón chân hướng lên trần nhà."], ["Place your hands on the floor in front of you.", "/pleɪs jɔːr hændz ɑːn ðə flɔːr ɪn frʌnt əv juː/", "Đặt hai tay xuống sàn phía trước."], ["Exhale, slowly walk your hands forward.", "/eksˈheɪl, ˈsloʊli wɔːk jɔːr hændz ˈfɔːrwərd/", "Thở ra, từ từ bước hai tay về phía trước."], ["Never force your legs. Stop if you feel pain.", "/ˈnevər fɔːrs jɔːr leɡz stɑːp ɪf juː fiːl peɪn/", "Đừng bao giờ ép chân. Dừng lại nếu bạn thấy đau."], ["Use blocks under your hands to support you.", "/juːz blɑːks ˈʌndər jɔːr hændz tuː səˈpɔːrt juː/", "Dùng gạch dưới tay để nâng đỡ."]]], "p-buom": ["Tư thế con bướm · Baddha Konasana", "Butterfly Pose", [["Sit tall with your legs straight.", "/sɪt tɔːl wɪð jɔːr leɡz streɪt/", "Ngồi thẳng, hai chân duỗi."], ["Bend your knees and bring the soles of your feet together.", "/bend jɔːr niːz ænd brɪŋ ðə soʊlz əv jɔːr fiːt təˈɡeðər/", "Gập gối và đưa hai lòng bàn chân vào nhau."], ["Hold your feet with your hands.", "/hoʊld jɔːr fiːt wɪð jɔːr hændz/", "Dùng hai tay giữ bàn chân."], ["Let your knees fall open to the sides.", "/let jɔːr niːz fɔːl ˈoʊpən tuː ðə saɪdz/", "Để hai đầu gối buông mở sang hai bên."], ["Lengthen your spine and lift your chest.", "/ˈleŋkθən jɔːr spaɪn ænd lɪft jɔːr tʃest/", "Kéo dài cột sống và nâng ngực."], ["Exhale, fold forward gently if it feels good.", "/eksˈheɪl, foʊld ˈfɔːrwərd ˈdʒentli ɪf ɪt fiːlz ɡʊd/", "Thở ra, gập người về trước nhẹ nhàng nếu thấy dễ chịu."], ["Breathe slowly for five breaths.", "/briːð ˈsloʊli fɔːr faɪv breθs/", "Thở chậm trong năm hơi thở."]]], "p-sava": ["Tư thế nằm thư giãn · Savasana", "Corpse Pose", [["Lie on your back and let your legs relax.", "/laɪ ɑːn jɔːr bæk ænd let jɔːr leɡz rɪˈlæks/", "Nằm ngửa và thả lỏng hai chân."], ["Let your feet fall open to the sides.", "/let jɔːr fiːt fɔːl ˈoʊpən tuː ðə saɪdz/", "Để hai bàn chân buông mở sang hai bên."], ["Place your arms by your sides with your palms up.", "/pleɪs jɔːr ɑːrmz baɪ jɔːr saɪdz wɪð jɔːr pɑːmz ʌp/", "Đặt hai tay dọc thân, lòng bàn tay ngửa lên."], ["Close your eyes.", "/kloʊz jɔːr aɪz/", "Nhắm mắt lại."], ["Let your breath return to its natural rhythm.", "/let jɔːr breθ rɪˈtɜːrn tuː ɪts ˈnætʃrəl ˈrɪðəm/", "Để hơi thở trở về nhịp tự nhiên."], ["Relax every part of your body.", "/rɪˈlæks ˈevri pɑːrt əv jɔːr ˈbɑːdi/", "Thả lỏng từng phần của cơ thể."], ["Stay here for five minutes.", "/steɪ hɪr fɔːr faɪv ˈmɪnəts/", "Ở lại đây năm phút."]]], "p-bankgia": ["Tư thế ngồi bán kết già · Ardha Padmasana", "Half Lotus", [["Sit tall with your legs straight.", "/sɪt tɔːl wɪð jɔːr leɡz streɪt/", "Ngồi thẳng, hai chân duỗi."], ["Bend your right knee and place your right foot on your left thigh.", "/bend jɔːr raɪt niː ænd pleɪs jɔːr raɪt fʊt ɑːn jɔːr left θaɪ/", "Gập gối phải và đặt bàn chân phải lên đùi trái."], ["Bend your left knee and tuck your left foot under your right thigh.", "/bend jɔːr left niː ænd tʌk jɔːr left fʊt ˈʌndər jɔːr raɪt θaɪ/", "Gập gối trái và luồn bàn chân trái xuống dưới đùi phải."], ["Do not force your knee. Stop if you feel pain in your knee.", "/duː nɑːt fɔːrs jɔːr niː stɑːp ɪf juː fiːl peɪn ɪn jɔːr niː/", "Đừng ép gối. Dừng lại nếu bạn thấy đau ở đầu gối."], ["Sit on a folded blanket to lift your hips.", "/sɪt ɑːn ə ˈfoʊldɪd ˈblæŋkɪt tuː lɪft jɔːr hɪps/", "Ngồi trên chăn gấp để nâng hông cao hơn."], ["Rest your hands on your knees.", "/rest jɔːr hændz ɑːn jɔːr niːz/", "Đặt hai tay lên đầu gối."], ["Lengthen your spine and breathe calmly.", "/ˈleŋkθən jɔːr spaɪn ænd briːð ˈkɑːmli/", "Kéo dài cột sống và thở êm dịu."]]], "p-ketgia": ["Tư thế ngồi kết già · Padmasana", "Full Lotus", [["Only practice lotus if your hips and knees are open and free of pain.", "/ˈoʊnli ˈpræktɪs ˈloʊtəs ɪf jɔːr hɪps ænd niːz ɑːr ˈoʊpən ænd friː əv peɪn/", "Chỉ tập kết già nếu hông và đầu gối đã mở và không đau."], ["Start in half lotus.", "/stɑːrt ɪn hæf ˈloʊtəs/", "Bắt đầu từ bán kết già."], ["Bring your left foot onto your right thigh.", "/brɪŋ jɔːr left fʊt ˈɑːntuː jɔːr raɪt θaɪ/", "Đưa bàn chân trái lên đùi phải."], ["Both feet rest on the opposite thighs, soles facing up.", "/boʊθ fiːt rest ɑːn ðə ˈɑːpəzɪt θaɪz soʊlz ˈfeɪsɪŋ ʌp/", "Hai bàn chân đặt lên đùi đối diện, lòng bàn chân hướng lên."], ["Sit tall and place your hands on your knees.", "/sɪt tɔːl ænd pleɪs jɔːr hændz ɑːn jɔːr niːz/", "Ngồi thẳng và đặt hai tay lên đầu gối."], ["Close your eyes and breathe slowly.", "/kloʊz jɔːr aɪz ænd briːð ˈsloʊli/", "Nhắm mắt và thở chậm."], ["Switch the cross of your legs next time.", "/swɪtʃ ðə krɔːs əv jɔːr leɡz nekst taɪm/", "Lần sau hãy đổi bên chân bắt chéo."]]], "m-ngu": ["Thiền dễ ngủ", "Sleep Meditation", [["Lie down comfortably and close your eyes.", "/laɪ daʊn ˈkʌmftərbli ænd kloʊz jɔːr aɪz/", "Nằm xuống thoải mái và nhắm mắt."], ["Let your body sink into the bed.", "/let jɔːr ˈbɑːdi sɪŋk ˈɪntuː ðə bed/", "Để cơ thể chìm vào giường."], ["Breathe in slowly for four counts.", "/briːð ɪn ˈsloʊli fɔːr fɔːr kaʊnts/", "Hít vào chậm trong bốn nhịp."], ["Breathe out slowly for six counts.", "/briːð aʊt ˈsloʊli fɔːr sɪks kaʊnts/", "Thở ra chậm trong sáu nhịp."], ["Relax your forehead, your eyes, and your jaw.", "/rɪˈlæks jɔːr ˈfɔːrhed jɔːr aɪz ænd jɔːr dʒɔː/", "Thả lỏng trán, mắt và hàm."], ["Let your shoulders feel heavy.", "/let jɔːr ˈʃoʊldərz fiːl ˈhevi/", "Để hai vai cảm thấy nặng."], ["Let go of everything you have to do today.", "/let ɡoʊ əv ˈevriθɪŋ juː hæv tuː duː təˈdeɪ/", "Buông bỏ mọi việc bạn phải làm hôm nay."], ["Your only job now is to rest.", "/jɔːr ˈoʊnli dʒɑːb naʊ ɪz tuː rest/", "Việc duy nhất của bạn bây giờ là nghỉ ngơi."], ["With each breath, you drift into a deeper sleep.", "/wɪð iːtʃ breθ juː drɪft ˈɪntuː ə ˈdiːpər sliːp/", "Với mỗi hơi thở, bạn trôi vào giấc ngủ sâu hơn."], ["Good night. Sleep well.", "/ɡʊd naɪt sliːp wel/", "Chúc ngủ ngon. Ngủ thật ngon."]]], "m-camxuc": ["Thiền chữa lành cảm xúc", "Emotional Healing Meditation", [["Sit comfortably and place a hand on your heart.", "/sɪt ˈkʌmftərbli ænd pleɪs ə hænd ɑːn jɔːr hɑːrt/", "Ngồi thoải mái và đặt một tay lên tim."], ["Take three slow, deep breaths.", "/teɪk θriː sloʊ diːp breθs/", "Hít sâu chậm ba hơi."], ["Notice what you are feeling right now.", "/ˈnoʊtɪs wʌt juː ɑːr ˈfiːlɪŋ raɪt naʊ/", "Để ý bạn đang cảm thấy gì ngay lúc này."], ["Do not judge it. Let it be here.", "/duː nɑːt dʒʌdʒ ɪt let ɪt bi hɪr/", "Đừng phán xét. Hãy để nó ở đây."], ["Name your feeling softly: sadness, anger, or fear.", "/neɪm jɔːr ˈfiːlɪŋ ˈsɔːftli ˈsædnəs ˈæŋɡər ɔːr fɪr/", "Gọi tên cảm xúc nhẹ nhàng: buồn, giận hay sợ."], ["Say to yourself: it is okay to feel this.", "/seɪ tuː jɔːrˈself ɪt ɪz oʊˈkeɪ tuː fiːl ðɪs/", "Tự nói với mình: cảm thấy như vậy là được."], ["Breathe in kindness and breathe out tension.", "/briːð ɪn ˈkaɪndnəs ænd briːð aʊt ˈtenʃn/", "Hít vào lòng tốt, thở ra căng thẳng."], ["Feel your heart becoming softer and lighter.", "/fiːl jɔːr hɑːrt bɪˈkʌmɪŋ ˈsɔːftər ænd ˈlaɪtər/", "Cảm nhận trái tim mềm và nhẹ hơn."], ["You are safe, and you are enough.", "/juː ɑːr seɪf ænd juː ɑːr ɪˈnʌf/", "Bạn an toàn, và bạn là đủ."]]], "m-moiquanhe": ["Thiền chữa lành mối quan hệ", "Relationship Healing Meditation", [["Think of a person you want to heal your relationship with.", "/θɪŋk əv ə ˈpɜːrsn juː wɑːnt tuː hiːl jɔːr rɪˈleɪʃnʃɪp wɪð/", "Nghĩ đến một người bạn muốn chữa lành mối quan hệ."], ["Imagine them in front of you, calm and gentle.", "/ɪˈmædʒɪn ðem ɪn frʌnt əv juː kɑːm ænd ˈdʒentl/", "Hình dung họ ở trước mặt bạn, bình tĩnh và dịu dàng."], ["Notice any tightness in your chest.", "/ˈnoʊtɪs ˈeni ˈtaɪtnəs ɪn jɔːr tʃest/", "Để ý sự thắt chặt nào ở ngực bạn."], ["Breathe in and soften your heart.", "/briːð ɪn ænd ˈsɔːfn jɔːr hɑːrt/", "Hít vào và làm mềm trái tim."], ["Silently say: I wish you peace.", "/ˈsaɪləntli seɪ aɪ wɪʃ juː piːs/", "Thầm nói: Tôi chúc bạn bình an."], ["Silently say: I wish you happiness.", "/ˈsaɪləntli seɪ aɪ wɪʃ juː ˈhæpinəs/", "Thầm nói: Tôi chúc bạn hạnh phúc."], ["Silently say: I forgive what I can forgive today.", "/ˈsaɪləntli seɪ aɪ fərˈɡɪv wʌt aɪ kæn fərˈɡɪv təˈdeɪ/", "Thầm nói: Tôi tha thứ những gì tôi có thể tha thứ hôm nay."], ["Now send the same kindness to yourself.", "/naʊ send ðə seɪm ˈkaɪndnəs tuː jɔːrˈself/", "Bây giờ hãy gửi lòng tốt ấy cho chính mình."], ["Let go of the pain and keep the lesson.", "/let ɡoʊ əv ðə peɪn ænd kiːp ðə ˈlesn/", "Buông nỗi đau và giữ lại bài học."]]], "m-taichinh": ["Thiền chữa lành tài chính", "Financial Healing Meditation", [["Sit tall and breathe slowly.", "/sɪt tɔːl ænd briːð ˈsloʊli/", "Ngồi thẳng và thở chậm."], ["Place one hand on your belly.", "/pleɪs wʌn hænd ɑːn jɔːr ˈbeli/", "Đặt một tay lên bụng."], ["Notice how your body feels when you think about money.", "/ˈnoʊtɪs haʊ jɔːr ˈbɑːdi fiːlz wen juː θɪŋk əˈbaʊt ˈmʌni/", "Để ý cơ thể cảm thấy thế nào khi bạn nghĩ về tiền."], ["Do not blame yourself for the past.", "/duː nɑːt bleɪm jɔːrˈself fɔːr ðə pæst/", "Đừng tự trách mình về quá khứ."], ["Breathe in calm and breathe out fear.", "/briːð ɪn kɑːm ænd briːð aʊt fɪr/", "Hít vào bình tĩnh, thở ra nỗi sợ."], ["Say to yourself: I am learning to manage money wisely.", "/seɪ tuː jɔːrˈself aɪ æm ˈlɜːrnɪŋ tuː ˈmænɪdʒ ˈmʌni ˈwaɪzli/", "Tự nói với mình: Tôi đang học cách quản lý tiền khôn ngoan."], ["Say: I make clear and calm decisions.", "/seɪ aɪ meɪk klɪr ænd kɑːm dɪˈsɪʒnz/", "Nói: Tôi đưa ra quyết định rõ ràng và bình tĩnh."], ["Say: I am grateful for what I have today.", "/seɪ aɪ æm ˈɡreɪtfl fɔːr wʌt aɪ hæv təˈdeɪ/", "Nói: Tôi biết ơn những gì tôi có hôm nay."], ["Imagine your life with enough, and feel peace in your body.", "/ɪˈmædʒɪn jɔːr laɪf wɪð ɪˈnʌf ænd fiːl piːs ɪn jɔːr ˈbɑːdi/", "Hình dung cuộc sống đủ đầy và cảm nhận bình an trong cơ thể."]]], "m-treem": ["Thiền chữa lành đứa trẻ bên trong", "Inner Child Healing Meditation", [["Sit comfortably and close your eyes.", "/sɪt ˈkʌmftərbli ænd kloʊz jɔːr aɪz/", "Ngồi thoải mái và nhắm mắt."], ["Imagine a small child version of you.", "/ɪˈmædʒɪn ə smɔːl tʃaɪld ˈvɜːrʒn əv juː/", "Hình dung một phiên bản nhỏ bé của bạn."], ["See the child clearly. How old are they?", "/siː ðə tʃaɪld ˈklɪrli haʊ oʊld ɑːr ðeɪ/", "Nhìn đứa trẻ rõ ràng. Bé bao nhiêu tuổi?"], ["Walk toward the child slowly and kindly.", "/wɔːk tɔːrd ðə tʃaɪld ˈsloʊli ænd ˈkaɪndli/", "Đi về phía đứa trẻ chậm rãi và dịu dàng."], ["Kneel down and look into their eyes.", "/niːl daʊn ænd lʊk ˈɪntuː ðer aɪz/", "Quỳ xuống và nhìn vào mắt bé."], ["Say: I am here with you now.", "/seɪ aɪ æm hɪr wɪð juː naʊ/", "Nói: Chị/anh ở đây v     var parts=[], seen={}; PH.forEach(function(l){ if(!seen[l.part]){ seen[l.part]=1; parts.push(l.part); } });
    var body=parts.map(function(p){
      return '<div class="stack"><h2>'+esc(p)+'</h2><div class="phgrid">'+PH.filter(function(l){return l.part===p;}).map(function(l){
        return '<button class="phtile" data-ph="'+l.id+'"><span class="sym">'+esc(l.sym)+'</span><span class="tt">'+esc(l.title.replace(/^(Phụ âm|Nguyên âm đôi|Nguyên âm dài|Nguyên âm ngắn)\s*/,'$1 '))+'</span></button>';
      }).join('')+'</div></div>';
    }).join('');
    return '<div class="stack"><h1>Học phiên âm tiếng Anh</h1>'+
      '<p class="muted">Học đọc phiên âm để tự đọc được bất kỳ câu tiếng Anh nào cho trôi chảy. Mỗi bài gồm cách phát âm và các từ vựng yoga thường dùng, có phiên âm Anh-Mỹ và nghĩa tiếng Việt. Bấm vào từ để nghe.</p>'+
      '<div class="stack"><h2>Bảng phiên âm tổng quát</h2><p class="muted small">Nhìn toàn bộ các âm trước khi học từng âm. Chạm vào ảnh để mở to.</p><a href="img/ipa-chart.png" target="_blank" rel="noopener noreferrer"><img class="ph-img" src="img/ipa-chart.png" alt="Bảng phiên âm IPA tiếng Anh-Mỹ: nguyên âm và phụ âm"></a></div>'+
      '<div class="panel stack"><h3>Tra từ điển chuẩn</h3><p class="muted small">Tra phiên âm và nghe phát âm chuẩn trên Oxford hoặc Cambridge Dictionary.</p><div><a class="btn small-btn ghost" href="https://dictionary.cambridge.org/" target="_blank" rel="noopener noreferrer">Mở Cambridge Dictionary</a></div></div>'+
      body+'</div>';
  }

  function accountView(){
    return '<div class="stack"><h1>Tài khoản</h1><div class="panel stack">'+
      '<div><p class="muted small">Đang đăng nhập</p><h2>'+esc(S.user.name)+'</h2><p class="muted">'+esc(S.user.email||"")+(S.user.exp?' · hạn dùng đến '+esc(S.user.exp):'')+'</p></div>'+
      '<div><span class="chip">Huấn luyện viên</span></div>'+
      '<div><button class="btn danger" data-a="logout">Đăng xuất</button></div></div>'+
      '<div class="panel stack"><h3>Giọng đọc</h3>'+
        (tts.ok && tts.list.length ?
          '<label for="voice-sel">Chọn giọng<select id="voice-sel" class="sel"><option value=""'+(pref.voice===''?' selected':'')+'>Tự chọn giọng tốt nhất'+(tts.voice?' (hiện là '+esc(tts.voice.name)+')':'')+'</option>'+
          tts.list.map(function(v){ return '<option value="'+esc(v.name)+'"'+(pref.voice===v.name?' selected':'')+'>'+esc(v.name)+' · '+esc(v.lang)+(voiceScore(v)>=40?' · chất lượng cao':'')+'</option>'; }).join('')+'</select></label>'
          : '<p class="muted small">'+(tts.ok ? 'Chưa tìm thấy giọng đọc tiếng Anh trên thiết bị này.' : 'Trình duyệt này chưa hỗ trợ đọc thành tiếng.')+'</p>')+
        '<div><p class="small muted" style="margin-bottom:6px">Tốc độ đọc</p><div class="fchips">'+
          [["slow","Chậm"],["calm","Bình an"],["normal","Bình thường"]].map(function(x){ return '<button class="fchip" data-pace="'+x[0]+'" aria-pressed="'+(pref.pace===x[0]?'true':'false')+'">'+x[1]+'</button>'; }).join('')+'</div></div>'+
        '<div><button class="btn small-btn" data-a="test-audio">Nghe thử</button></div>'+
        '<p class="small muted">Giọng đọc lấy từ điện thoại của bạn nên chất lượng khác nhau giữa các máy. Muốn giọng mượt và tự nhiên hơn, hãy tải giọng chất lượng cao: iPhone vào Cài đặt, Trợ năng, Nội dung đã đọc, Giọng nói, chọn tiếng Anh rồi tải giọng Ava hoặc Samantha bản Nâng cao hoặc Cao cấp. Android vào Cài đặt, Chuyển văn bản thành giọng nói, tải giọng tiếng Anh (Mỹ). Trên Edge, chọn giọng có chữ Natural hoặc Online.</p></div></div>';
  }

  function render(){
    if(!S.user){ app.innerHTML = '<div class="wrap">'+loginView()+'</div>'; return; }
    var view = {"trang-chu":homeView,"the-yoga":cardsView,"tro-choi":gamesView,"giao-tiep":talkView,"loi-ho":scriptsView,"phien-am":phonView,"tai-khoan":accountView}[S.tab]();
    var nav = TABS.map(function(t){
      return '<button data-go="'+t[0]+'"'+(t[0]===S.tab?' aria-current="page"':'')+'>'+t[1]+'</button>';
    }).join('');
    app.innerHTML = '<div class="wrap"><div class="topbar"><span class="brand">Sophia<span> Yoga English</span></span></div>'+view+'</div>'+
      '<nav class="nav" aria-label="Các phần học"><div class="nav-in">'+nav+'</div></nav>';
  }

  /* ---------- sự kiện ---------- */
  function go(tab){
    clearTimeout(recTimer);
    S.tab=tab; S.phl=null; S.sel=null; S.adding=false; S.deck=null; S.addingDeck=false; S.err="";
    if(location.hash.slice(1)!==tab) location.hash=tab; else render();
    window.scrollTo(0,0);
  }

  app.addEventListener("click",function(e){
    var el = e.target.closest("[data-go],[data-say],[data-sel],[data-step],[data-deck],[data-cat],[data-pace],[data-pick],[data-game],[data-gt],[data-ph],[data-a]");
    if(!el) return;
    if(el.dataset.go){ go(el.dataset.go); return; }
    if(el.dataset.say){ speak(el.dataset.say); return; }
    if(el.dataset.step!==undefined){ stepCard(+el.dataset.step); return; }
    if(el.dataset.sel!==undefined){ S.sel=+el.dataset.sel; S.flip=false; S.dir=0; render(); window.scrollTo(0,0); return; }
    if(el.dataset.pace){ pref.pace=el.dataset.pace; savePref(); render(); speak("Breathe in, and breathe out slowly."); return; }
    if(el.dataset.cat!==undefined){ S.cat=el.dataset.cat; render(); return; }
    if(el.dataset.deck!==undefined){ S.deck=+el.dataset.deck; S.cat=""; S.sel=null; S.adding=false; S.err=""; render(); window.scrollTo(0,0); return; }
    if(el.dataset.ph){ S.phl=el.dataset.ph; render(); window.scrollTo(0,0); return; }
    if(el.dataset.gt){
      var g=el.dataset.gt, t=S.gtopics.slice();
      if(g==="all") t=["all"]; else { t=t.filter(function(x){return x!=="all";}); var ix=t.indexOf(g); if(ix>=0) t.splice(ix,1); else t.push(g); if(!t.length) t=["all"]; }
      S.gtopics=t; render(); return;
    }
    if(el.dataset.game){ startGame(el.dataset.game); render(); window.scrollTo(0,0); return; }
    if(el.dataset.pick!==undefined){
      var q=S.quiz; if(!q || q.picked!==null) return;
      q.picked=+el.dataset.pick; if(q.opts[q.picked]===q.order[q.i]) q.score++; render(); return;
    }
    var a = el.dataset.a, qq = S.quiz;
    if(a==="demo"){ /* đã tắt: không còn vào xem thử */ }
    else if(a==="logout"){ clearTimeout(recTimer); saveUser(null); S.user=null; S.quiz=null; S.tab="trang-chu"; S.sel=null; S.adding=false; S.err=""; if(location.hash) location.hash=""; render(); }
    else if(a==="test-audio"){ pickVoice(); speak("Breathe in, and lift your arms. Now breathe out slowly, and relax. Mountain pose."); }
    else if(a==="back"){ S.sel=null; S.flip=false; S.dir=0; render(); }
    else if(a==="flip"){
      S.flip=!S.flip; S.dir=0;
      var fl=app.querySelector&&app.querySelector('.flip');
      if(fl){ fl.classList.toggle('is-flipped',S.flip);
        var fs=app.querySelectorAll('.face'); if(fs&&fs.length===2){ fs[0].setAttribute('aria-hidden',S.flip?'true':'false'); fs[1].setAttribute('aria-hidden',S.flip?'false':'true'); } }
      else render();
    }
    else if(a==="back-decks"){ S.deck=null; S.cat=""; S.sel=null; S.adding=false; S.err=""; render(); window.scrollTo(0,0); }
    else if(a==="add-deck"){ S.addingDeck=true; S.err=""; render(); }
    else if(a==="cancel-deck"){ S.addingDeck=false; S.err=""; render(); }
    else if(a==="add"){ S.adding=true; S.img=""; S.err=""; render(); }
    else if(a==="cancel-add"){ S.adding=false; S.err=""; render(); }
    else if(a==="ph-back"){ S.phl=null; render(); window.scrollTo(0,0); }
    else if(a==="quiz-exit"){ clearTimeout(recTimer); S.quiz=null; render(); }
    else if(a==="quiz-next"){
      qq.picked=null; qq.i++;
      if(qq.i>=qq.order.length) finish(); else makeOpts();
      render();
    }
    else if(a==="rec"){ startRec(qq); }
    else if(a==="retry"){ qq.state="idle"; qq.tries++; render(); }
    else if(a==="next-speak"){
      qq.i++; qq.state="idle"; qq.tries=0; qq.pct=null;
      if(qq.i>=qq.order.length) finish();
      render();
    }
  });

  function visIdx(){
    var d=S.decks[S.deck]; if(!d) return [];
    var r=[]; d.cards.forEach(function(p,i){ if(!d.cats || S.cat==='' || p.cat===S.cat) r.push(i); }); return r;
  }
  function stepCard(dir){
    if(S.tab!=="the-yoga" || S.deck===null || S.sel===null) return;
    var v=visIdx(), pos=v.indexOf(S.sel), np=pos+dir;
    if(pos<0 || np<0 || np>=v.length) return;
    S.sel=v[np]; S.flip=false; S.dir=dir; render(); window.scrollTo(0,0);
  }
  var tx=null, ty=null;
  app.addEventListener("touchstart",function(e){ var t=e.touches&&e.touches[0]; if(t){ tx=t.clientX; ty=t.clientY; } },{passive:true});
  app.addEventListener("touchend",function(e){
    if(tx===null) return; var t=e.changedTouches&&e.changedTouches[0]; if(!t){ tx=null; return; }
    var dx=t.clientX-tx, dy=t.clientY-ty; tx=null;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) stepCard(dx<0?1:-1);
  },{passive:true});
  document.addEventListener&&document.addEventListener("keydown",function(e){
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName||"")) return;
    if(e.key==="ArrowRight") stepCard(1); else if(e.key==="ArrowLeft") stepCard(-1);
  });

  app.addEventListener("change",function(e){
    if(e.target.id==="voice-sel"){ pref.voice=e.target.value||""; savePref(); pickVoice(); render(); speak("Breathe in, and lift your arms. Now breathe out slowly."); return; }
    if(e.target.id!=="f-img") return;
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var r=new FileReader(); r.onload=function(){ S.img=String(r.result); }; r.readAsDataURL(f);
  });

  app.addEventListener("submit",function(e){
    e.preventDefault();
    if(e.target.id==="login-form"){
      var em=document.getElementById("email").value.trim().toLowerCase(), pw=document.getElementById("pass").value; try{ pw=pw.normalize("NFC"); }catch(e){}
      if(!em||!pw){ S.err="Nhập tên đăng nhập và mật khẩu."; render(); return; }
      var ac=acctFind(em);
      if(!ac || acctVerify(em,pw,ac.s)!==ac.h){ S.err="Tên đăng nhập hoặc mật khẩu chưa đúng."; render(); return; }
      if(!acctOk(ac)){ S.err="Tài khoản đang bị khóa hoặc đã hết hạn. Hãy liên hệ Sophia."; render(); return; }
      var nm = acctName(ac.n,ac.s,pw) || em;
      S.user={name:nm,email:em,exp:ac.x||""}; saveUser(S.user); S.qi=null; S.err=""; render();
    } else if(e.target.id==="deck-form"){
      var nm2=document.getElementById("d-name").value.trim();
      if(!nm2){ S.err="Nhập tên bộ thẻ."; render(); return; }
      S.decks.push({id:"moi-"+S.decks.length, t:nm2, en:"", d:"", cards:[]});
      S.deck=S.decks.length-1; S.addingDeck=false; S.err=""; render();
    } else if(e.target.id==="add-form"){
      var en=document.getElementById("f-en").value.trim();
      if(!en){ S.err="Nhập tên tiếng Anh của tư thế."; render(); return; }
      S.decks[S.deck].cards.push({en:en,vi:document.getElementById("f-vi").value.trim(),cueEn:document.getElementById("f-cen").value.trim(),cueVi:document.getElementById("f-cvi").value.trim(),img:S.img});
      S.adding=false; S.err=""; S.img=""; render();
    }
  });

  function route(){
    clearTimeout(recTimer);
    var h=location.hash.slice(1);
    var ok=TABS.some(function(t){return t[0]===h;});
    S.tab = ok?h:"trang-chu"; S.sel=null; S.flip=false; S.dir=0; S.adding=false; S.deck=null; S.addingDeck=false; render();
  }
  window.addEventListener("hashchange",route);
  route();
})();
</script>

</body></html>
