<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiếng Anh cho HLV Yoga · Sophia Yoga</title>
<link rel="icon" href="../images/favicon.png?v=3" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf0;--soft:#fff3cf;--ink:#3b2a1a;--brown:#5a3a1e;--muted:#6f5a45;--gold:#e8b400;--gold2:#c98f00;--btn:#ffd60a;--btn2:#ffe14d;--line:#efe1bd;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.logo img{width:52px;height:auto}
.logo b{font-family:"Dancing Script",cursive;font-size:2.2rem;color:var(--gold);line-height:1}
.logo span{font-family:Quicksand,sans-serif;font-weight:700;font-size:1.4rem;color:var(--brown)}
.tag{font-family:Quicksand,sans-serif;font-weight:700;color:var(--gold2);background:var(--soft);border-radius:999px;padding:4px 14px;font-size:.9rem}
h1,h2{font-family:Quicksand,sans-serif;color:var(--brown);line-height:1.2;margin:0}
h1{font-size:clamp(1.8rem,4.5vw,2.6rem);margin:36px 0 8px}
h1 em{font-style:normal;color:var(--gold)}
h2{font-size:1.35rem;margin:36px 0 14px;padding-left:12px;border-left:5px solid var(--btn)}
h2 small{font-size:.85rem;color:var(--muted);font-weight:600;margin-left:6px}
.count{color:var(--muted);margin:0 0 4px}
.lock{max-width:420px;margin:48px auto 80px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 26px;text-align:center;box-shadow:0 10px 30px rgba(120,80,20,.1)}
.lock .ic{font-size:2.4rem}
.lock p{color:var(--muted);margin:6px 0 18px}
.lock input{width:100%;font:600 1.05rem Nunito,sans-serif;padding:12px 16px;border:2px solid var(--line);border-radius:14px;outline:none}
.lock input:focus{border-color:var(--gold)}
.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:999px;padding:12px 26px;font:700 1rem Quicksand,sans-serif;cursor:pointer;background:linear-gradient(180deg,var(--btn2),var(--btn));color:var(--ink);box-shadow:0 6px 18px rgba(224,168,0,.35);margin-top:14px;width:100%;text-decoration:none}
.btn:focus-visible,.play:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.err{color:#b3261e;min-height:1.4em;margin:10px 0 0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vid{margin:0;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.play{all:unset;display:block;position:relative;width:100%;aspect-ratio:16/9;cursor:pointer;background:#2b1d10}
.play img{width:100%;height:100%;object-fit:cover;display:block}
.pbtn{position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;background:rgba(255,214,10,.95);display:grid;place-items:center;font-size:1.5rem;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pl{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:18px}.pl iframe{display:block;width:100%;aspect-ratio:16/9;border:0}.vid iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.vid figcaption{padding:10px 14px 14px;font-weight:700;color:var(--brown);font-size:.98rem}
.note{background:var(--soft);border-radius:16px;padding:14px 18px;color:var(--muted);margin:40px 0 0;font-size:.92rem}
footer{color:var(--muted);text-align:center;font-size:.9rem;padding:36px 0 50px}
footer a{color:var(--gold2);font-weight:700}
#out[hidden],#lock[hidden]{display:none}
@media (max-width:860px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.grid{grid-template-columns:1fr}.tag{display:none}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="../"><img src="../images/logo.png?v=3" alt="" width="52" height="45"><b>Sophia</b><span>Yoga</span></a><span class="tag">Tiếng Anh cho HLV</span></div></header>
<main class="wrap">
  <h1>Tiếng Anh cho <em>HLV Yoga</em></h1>
  <form class="lock" id="lock" autocomplete="off">
    <div class="ic" aria-hidden="true">🔒</div>
    <p>Khóa học dành riêng cho học viên. Nhập mật khẩu Sophia đã gửi để vào học.</p>
    <label for="pw" style="position:absolute;left:-9999px">Mật khẩu</label>
    <input id="pw" type="password" placeholder="Mật khẩu" required autofocus>
    <button class="btn" type="submit" id="go">Vào học</button>
    <p class="err" id="err" role="status"></p>
  </form>
  <div id="out" hidden></div>
  <p class="note" id="note" hidden>Khóa học chỉ dành cho học viên. Vui lòng không chia sẻ link hoặc mật khẩu ra ngoài.</p>
</main>
